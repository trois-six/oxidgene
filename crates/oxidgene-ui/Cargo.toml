[package]
name = "oxidgene-ui"
description = "OxidGene Dioxus frontend components (shared web/desktop)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
oxidgene-core = { workspace = true }
dioxus = { workspace = true, features = ["router"] }
# The Geneanet login window runs on the platform event loop, not on Dioxus's,
# so what it reports back crosses threads through a channel.
futures-channel = "0.3"
futures-util = "0.3"
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
rfd = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time", "fs", "io-util"] }
