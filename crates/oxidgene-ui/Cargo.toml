[package]
name = "oxidgene-ui"
description = "OxidGene Dioxus frontend components (shared web/desktop)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
telemetry-client = ["dep:opentelemetry", "dep:tracing-opentelemetry"]
compressed-locales = ["dep:brotli", "dep:brotli-decompressor"]

[build-dependencies]
brotli = { workspace = true, optional = true }

[dependencies]
oxidgene-core = { workspace = true }
# The archive catalogue and the citation parser; never the native transport,
# which the web build cannot link.
oxidgene-archives = { workspace = true }
dioxus = { workspace = true, features = ["router"] }
# The Geneanet login window runs on the platform event loop, not on Dioxus's,
# so what it reports back crosses threads through a channel.
futures-channel = "0.3"
futures-util = "0.3"
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
rfd = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 0.3, the release dioxus-web depends on, so the bundle carries one.
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brotli-decompressor = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "fs", "io-util"] }
tempfile = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

# The page-trace test runs a real client span pipeline against a one-shot
# backend.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["net", "io-util"] }
