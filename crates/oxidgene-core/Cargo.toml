[package]
name = "oxidgene-core"
description = "OxidGene domain types, enums, and shared error types"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# JSON Schema derives for the enums an MCP tool accepts as input.
schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# Canonical decomposition, so that `search::fold_words` unaccents the letters
# of every script (é, ệ, ά, й…) the same way on the server and in WASM.
unicode-normalization = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
