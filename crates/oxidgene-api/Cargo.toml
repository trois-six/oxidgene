[package]
name = "oxidgene-api"
description = "OxidGene REST and GraphQL API layer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["oxidgene-db/postgres"]
# GraphQL endpoint — opt in for the server binary; desktop skips async-graphql entirely.
# base64 rides along: it only decodes the `.gw` payload of the GeneWeb mutation,
# which REST receives raw and so does not need.
graphql = ["dep:async-graphql", "dep:async-graphql-axum", "dep:base64"]

[dependencies]
oxidgene-core = { workspace = true }
oxidgene-db = { workspace = true }
oxidgene-gedcom = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
async-graphql = { workspace = true, optional = true }
async-graphql-axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
flate2 = { workspace = true }
# Media storage (Sprint F.1)
async-trait = "0.1"
dirs = { workspace = true }
image = { workspace = true }
lopdf = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
flate2 = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true }
uuid = { workspace = true }
http-body-util = "0.1"
