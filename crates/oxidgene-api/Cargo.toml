[package]
name = "oxidgene-api"
description = "OxidGene REST and GraphQL API layer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["oxidgene-db/postgres"]
# GraphQL endpoint — the server and the desktop binary both opt in, so REST and
# GraphQL are served side by side wherever the API is (about 4.6 MiB of release
# desktop binary). The background worker serves no HTTP and leaves it out.
graphql = ["dep:async-graphql", "dep:async-graphql-axum"]
# S3-compatible media storage — the standalone server opts in; desktop stays local.
s3 = ["dep:object_store"]
telemetry-context = ["dep:oxidgene-observability", "oxidgene-db/telemetry-context"]
# MCP server over stdio — only the desktop binary opts in.
mcp = ["dep:rmcp", "dep:schemars", "oxidgene-db/schema", "oxidgene-core/schema"]

[dependencies]
oxidgene-core = { workspace = true }
oxidgene-db = { workspace = true }
oxidgene-gedcom = { workspace = true }
oxidgene-geneanet = { workspace = true }
oxidgene-observability = { workspace = true, optional = true }
axum = { workspace = true }
tower-http = { workspace = true }
async-graphql = { workspace = true, optional = true }
async-graphql-axum = { workspace = true, optional = true }
# Decodes the `.gw` payload of the GraphQL GeneWeb mutation and of the Geneanet
# wizard's JSON bodies, which bundle the file with other fields. The plain
# GeneWeb REST import receives it raw and needs none of this.
base64 = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `v4` draws the desktop's per-launch access token (see `access`).
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }
# Decodes the embedded data (see `embedded`); `build.rs` compresses it.
brotli-decompressor = { workspace = true }
# Accent folding for reference lookups; already in the tree through the
# Geneanet crate.
unicode-normalization = { workspace = true }
# Packing a multi-page document's pages into one download. Same crate the
# Geneanet session container uses.
zip = { workspace = true }
# Media storage (Sprint F.1)
async-trait = "0.1"
# Ingesting several media at once: decoding and thumbnailing is what an import
# spends its minutes on, and each medium is independent of the others.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dirs = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
object_store = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[build-dependencies]
brotli = { workspace = true }
serde_json = { workspace = true }
syn = { version = "3", features = ["full"] }

[dev-dependencies]
# Round-trips the embedded-data decoder.
brotli = { workspace = true }
image = { workspace = true }
# The SDK's own client drives the MCP server in the integration tests.
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true }
uuid = { workspace = true }
http-body-util = "0.1"
tracing-subscriber = { workspace = true }
