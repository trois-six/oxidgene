[package]
name = "oxidgene-api"
description = "OxidGene REST and GraphQL API layer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
postgres = ["oxidgene-db/postgres"]
# GraphQL endpoint — opt in for the server binary; desktop skips async-graphql entirely.
graphql = ["dep:async-graphql", "dep:async-graphql-axum"]
# S3-compatible media storage — the standalone server opts in; desktop stays local.
s3 = ["dep:object_store"]

[dependencies]
oxidgene-core = { workspace = true }
oxidgene-db = { workspace = true }
oxidgene-gedcom = { workspace = true }
oxidgene-geneanet = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
async-graphql = { workspace = true, optional = true }
async-graphql-axum = { workspace = true, optional = true }
# Decodes the `.gw` payload of the GraphQL GeneWeb mutation and of the Geneanet
# wizard's JSON bodies, which bundle the file with other fields. The plain
# GeneWeb REST import receives it raw and needs none of this.
base64 = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }
flate2 = { workspace = true }
# Packing a multi-page document's pages into one download. Same crate the
# Geneanet session container uses.
zip = { workspace = true }
# Media storage (Sprint F.1)
async-trait = "0.1"
# Ingesting several media at once: decoding and thumbnailing is what an import
# spends its minutes on, and each medium is independent of the others.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dirs = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
object_store = { workspace = true, optional = true }

[build-dependencies]
flate2 = { workspace = true }
serde_json = { workspace = true }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
image = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true }
uuid = { workspace = true }
http-body-util = "0.1"
