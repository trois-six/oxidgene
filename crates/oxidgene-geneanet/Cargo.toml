[package]
name = "oxidgene-geneanet"
description = "Recovers the Geneanet person↔media links that no export carries"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
oxidgene-core = { workspace = true }
# Media cross the wire base64-encoded (IPC carries text); a session archive
# stores them as the bytes they are.
base64 = { workspace = true }
geneweb = { workspace = true }
# Decoding archive entries and renditions so they can be perceptually hashed
# (see `phash`). Already in the tree for media thumbnails.
image = { workspace = true }
# The coarse tier of the content index decodes JPEGs through a reduced IDCT,
# which `image` does not expose. Pure Rust, no transitive weight, and already
# in the tree.
jpeg-decoder = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
zune-core = { workspace = true }
zune-jpeg = { workspace = true }

[[test]]
name = "phash_separation"
path = "tests/phash_separation.rs"
