[package]
name = "oxidgene-geneanet"
description = "Recovers the Geneanet person↔media links that no export carries"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
# Media cross the wire base64-encoded (IPC carries text); a session archive
# stores them as the bytes they are.
base64 = { workspace = true }
geneweb = { workspace = true }
# Decoding archive entries and renditions so they can be perceptually hashed
# (see `phash`). Already in the tree for media thumbnails.
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
