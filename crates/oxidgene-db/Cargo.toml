[package]
name = "oxidgene-db"
description = "OxidGene database entities, migrations, and repository layer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Enable the PostgreSQL driver — opt in for the server binary; desktop uses SQLite only.
#
# TLS rides along with it. The base runtime carries none, because the desktop's
# SQLite is a file on the same disk; a Postgres connection crosses a network and
# a managed provider will insist on encrypting it.
postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm/runtime-tokio-rustls",
    "sea-orm-migration/sqlx-postgres",
    "sea-orm-migration/runtime-tokio-rustls",
]
telemetry-context = ["dep:oxidgene-observability"]
# JSON Schema derives for the search filters an MCP tool accepts as input.
schema = ["dep:schemars", "oxidgene-core/schema"]

[dependencies]
oxidgene-core = { workspace = true }
oxidgene-observability = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# The flat portrait row crosses to the API layer as JSON.
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
ammonia = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
