[package]
name = "oxidgene-archives"
description = "Archive catalogue, citation parsing and portal adapters resolving a cited source to its image"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The `reqwest` transport, for the processes that reach portals directly. The
# web build never enables it: it parses citations and builds offline targets.
native = ["dep:reqwest"]
# The live checks of the portals (Archive Portals §9.1): their discovery and
# reports, and the bridge binary that runs an adapter's requests in the
# Playwright check's browser page. No application enables it.
live = []

# Speaks JSON lines with `e2e/archives/live.spec.ts` (`just archives-live`).
[[bin]]
name = "archives-live-bridge"
path = "src/bin/archives-live-bridge.rs"
required-features = ["live"]

# Steps 1 to 3 of the live checks over the native transport, `#[ignore]`d.

[dependencies]
# The Republican calendar, to read a register's year written `an XII`.
oxidgene-core = { workspace = true }
serde = { workspace = true }
# The catalogue documents, and the adapters' `portal` settings and responses.
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# The runtime `reqwest` needs, for the native live checks (`tests/live.rs`).
tokio = { workspace = true }
