[package]
name = "oxidgene-gedcom"
description = "OxidGene GEDCOM and GeneWeb import, GEDCOM export (wraps oxidged and geneweb)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
oxidgene-core = { workspace = true }
oxidged = { workspace = true }
geneweb = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
zip = { workspace = true }

# One integration test binary, linked once: `tests/integration.rs` declares
# the other files of `tests/` as its modules (`autotests` is off).
[[test]]
name = "integration"
path = "tests/integration.rs"
