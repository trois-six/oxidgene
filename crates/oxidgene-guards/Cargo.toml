[package]
name = "oxidgene-guards"
description = "OxidGene repository guards: tests that read the sources and fail when the codebase drifts from its rules"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

# No dependencies: the guards read text with the standard library, so the
# crate builds in seconds and `just check` stays fast.
[dependencies]

# One integration test binary, linked once: `tests/integration.rs` declares
# the other files of `tests/` as its modules (`autotests` is off).
[[test]]
name = "integration"
path = "tests/integration.rs"
