name: Changes since the last run
description: >-
  Tells a scheduled workflow whether its branch moved since its previous
  run, cancelled ones aside: the same commit would test the same code
  again. A run on demand, or as a release gate, always runs. The job needs
  the `actions: read` permission.

inputs:
  workflow:
    description: The file name of the workflow asking, such as nightly.yml
    required: true

outputs:
  run:
    description: Whether to run - false only for a scheduled run of a commit already run
    value: ${{ steps.since.outputs.run }}

runs:
  using: composite
  steps:
    - name: Compare with the previous run's commit
      id: since
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != schedule ]; then
          echo run=true >> "$GITHUB_OUTPUT"
          exit 0
        fi
        last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=20" \
          --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")][0].head_sha // empty")
        if [ "$last" = "$GITHUB_SHA" ]; then
          echo "Nothing changed since the previous run, at $last: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          echo run=false >> "$GITHUB_OUTPUT"
        else
          echo run=true >> "$GITHUB_OUTPUT"
        fi
