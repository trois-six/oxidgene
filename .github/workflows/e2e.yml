name: E2E

# The Playwright suite of `e2e/` (`just e2e`): the web bundle and the server,
# driven in Chromium on a throwaway SQLite database. It includes the tier 3
# guards of the browser — the request budgets of every page and the trace
# continuity of every display (docs/development.md §2.8).
#
# nightly.yml calls it every night and on demand, release.yml before a
# release; it also runs on its own on demand.

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match the ports in e2e/playwright.config.ts and the justfile.
  E2E_API_PORT: "18080"
  E2E_WEB_PORT: "18081"

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      # The toolchain of rust-toolchain.toml, with its WebAssembly target.
      - name: Install Rust
        run: rustup toolchain install

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      # A prebuilt binary through cargo-binstall; the version of mise.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the web bundle
        run: OXIDGENE_API_URL="http://127.0.0.1:${E2E_API_PORT}" scripts/dx.sh build --package oxidgene-web --platform web

      - name: Build the server
        run: cargo build --locked --package oxidgene-server

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npx playwright test

      # The time each page took to show its content, under 50 ms of added
      # latency: a trend to follow, never a gate.
      - name: Upload the request report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: request-report
          path: e2e/test-results/request-report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
