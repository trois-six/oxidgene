name: E2E

# The Playwright suite of `e2e/` (`just e2e`): the web bundle and the server,
# driven in Chromium on a throwaway SQLite database. It includes the tier 3
# guards of the browser — the request budgets of every page and the trace
# continuity of every display (docs/development.md §2.8).
#
# nightly.yml calls it every night and on demand, release.yml before a
# release; it also runs on its own on demand.

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The ports of e2e/playwright.config.ts and of the justfile, which reads
  # them.
  E2E_API_PORT: "18080"
  E2E_WEB_PORT: "18081"

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-just

      # The toolchain of rust-toolchain.toml, with its WebAssembly target.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A prebuilt binary through cargo-binstall; the version of mise.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The web bundle and the server built, Playwright and its Chromium
      # installed, then the suite in the Chromium project.
      - name: Run the end-to-end tests
        run: just e2e --project=chromium

      # The time each page took to show its content, under 50 ms of added
      # latency: a trend to follow, never a gate.
      - name: Upload the request report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: request-report
          path: e2e/test-results/request-report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
