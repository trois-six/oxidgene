name: Build & Publish CI Image

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ci-runner

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.ci
          context: .
          outputs: type=registry,compression=zstd,force-compression=true
          # A single manifest, not an index whose untagged children the
          # prune below would delete from under :latest.
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Housekeeping only after a successful push: delete the versions the
      # push left untagged, never :latest. A rebuild from cache can push a
      # manifest identical to an older version, which then only gains the
      # tag, so keeping "the newest version" would keep the wrong one.
      # Deleting needs the repository's Admin role in the package's Actions
      # access. Never fail the build on a prune error.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ci-runner
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
