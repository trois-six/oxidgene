name: Release

# A release passes every guard first: tiers 1 and 2 (ci.yml, every job
# whatever changed), tier 3 (nightly.yml) and tier 4 (weekly.yml) are
# required gates here (docs/development.md §2.8). A push to a `release/**` branch runs the gates
# and builds and smoke-tests the desktop, to rehearse a release; a `v*` tag
# runs them, builds the images and runs the end-to-end suite against them,
# then publishes (docs/development.md §6).
#
# What is published is built from the tagged sources alone: the jobs that
# build the images and the desktop restore no build cache, which a run of
# another workflow could have written, and every action is pinned to a
# commit. Renovate never merges an update of this workflow's actions or of
# the published images' Dockerfiles by itself (renovate.json).

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Tiers 1 and 2
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      all: true

  nightly:
    name: Tier 3
    permissions:
      contents: read
      packages: read
      # Its first job compares a scheduled run with the previous one.
      actions: read
    uses: ./.github/workflows/nightly.yml

  weekly:
    name: Tier 4
    permissions:
      contents: read
      packages: read
      # Its first job compares a scheduled run with the previous one.
      actions: read
    uses: ./.github/workflows/weekly.yml

  # Tier 4 reports its next-toolchain jobs without failing; everything else
  # the tiers run must have passed.
  gates:
    name: Release gates
    needs: [ci, nightly, weekly]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        run: echo "tiers 1 to 4 passed"

  metadata:
    name: Validate release version
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      # The tag is `v` and the version of the workspace and of the chart.
      - name: Validate tag against package versions
        id: version
        shell: bash
        run: |
          version="$(just release-version "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The images go to the registry by digest only, untagged: `e2e` tests
  # those very digests, and `publish-images` tags them once it passed.
  images:
    name: Build ${{ matrix.image }} image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The server and the worker are two targets of one Dockerfile; the
        # web image is its Dockerfile's last stage.
        include:
          - image: oxidgene-server
            dockerfile: docker/Dockerfile.backend
            target: server
          - image: oxidgene-worker
            dockerfile: docker/Dockerfile.backend
            target: worker
          - image: oxidgene-web
            dockerfile: docker/Dockerfile.web
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          # No layer cache: a published image is built from its sources.
          no-cache: true

      # A matrix job's outputs cannot tell its legs apart: each leg hands its
      # digest on as an artifact named after the image.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.image }}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # The Playwright suite of e2e/ against the images just built, started with
  # docker/docker-compose.e2e.yml: PostgreSQL, the server, the web bundle and
  # an ingress serving both from one origin (docs/development.md §2.7). The
  # server keeps its media on its own disk there and runs the jobs itself, so
  # the worker's image, built from the same stage, is not started.
  e2e:
    name: End-to-end tests of the images
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every later compose command reads them.
      - name: Name the images by digest
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}"
          {
            echo "OXIDGENE_SERVER_IMAGE=$image/oxidgene-server@$(cat digests/oxidgene-server)"
            echo "OXIDGENE_WEB_IMAGE=$image/oxidgene-web@$(cat digests/oxidgene-web)"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Starts the images behind one origin, runs the suite against it, keeps
      # the containers' logs and removes the stack.
      - name: Run the end-to-end tests against the images
        run: just e2e-images --project=chromium

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  # The tested digests under the release's version and `latest`. A tag
  # copies the image index whole, its provenance and SBOM with it.
  publish-images:
    name: Publish images
    needs: [metadata, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the images
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for image in oxidgene-server oxidgene-worker oxidgene-web; do
            name="${REGISTRY}/${{ github.repository_owner }}/$image"
            docker buildx imagetools create \
              --tag "$name:$VERSION" \
              --tag "$name:latest" \
              "$name@$(cat "digests/$image")"
            docker buildx imagetools inspect "$name:$VERSION"
          done

  # Published once the images it deploys passed.
  chart:
    name: Publish Helm chart
    needs: [metadata, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.7"

      # Every authentication mode linted and rendered.
      - name: Lint and test the chart
        run: just chart-test

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/oxidgene \
            --destination dist \
            --version "${{ needs.metadata.outputs.version }}" \
            --app-version "${{ needs.metadata.outputs.version }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish chart
        run: |
          helm push "dist/oxidgene-${{ needs.metadata.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Upload packaged chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  # A rehearsal builds and packages the desktop too, unsigned; a tag signs the
  # Windows executable through SignPath once its version is validated. Signing
  # is on once the repository variable SIGNPATH_ORGANIZATION_ID is set
  # (docs/development.md §6); until then a tag publishes it unsigned.
  desktop:
    name: Build desktop for ${{ matrix.platform }}
    needs: [gates, metadata]
    if: ${{ !cancelled() && needs.gates.result == 'success' && needs.metadata.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    permissions:
      contents: read
      # SignPath reads the job and downloads the unsigned artifact.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      # The toolchain of rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev mold \
            pkg-config zstd

      # No build cache is restored: the executables that are signed and
      # published are compiled from the tagged sources and the lockfile's
      # crates alone. `sh`, which just runs its recipes with, is Git's on
      # Windows.
      - name: Build desktop binary
        if: runner.os != 'macOS'
        shell: bash
        run: just build-desktop-release

      # One binary per architecture, joined by scripts/macos-app.sh into a
      # universal one, wrapped in OxidGene.app and put in the disk image.
      - name: Build and package macOS application
        if: runner.os == 'macOS'
        run: just build-desktop-macos-app dist/oxidgene-desktop-macos-universal.dmg

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/oxidgene-desktop-linux-x86_64.tar.gz oxidgene-desktop

      # SignPath signs what this artifact holds, following the project's
      # artifact configuration and after a manual approval
      # (docs/development.md §6). The artifact is never published.
      - name: Upload unsigned Windows executable
        id: unsigned
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: target/release/oxidgene-desktop.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: oxidgene
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Leaves the approver three hours, within the job's six.
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed
          parameters: |
            version: "${{ needs.metadata.outputs.version }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXE: ${{ env.SIGN == 'true' && 'signed' || 'target/release' }}/oxidgene-desktop.exe
        run: |
          if ($env:SIGN -eq 'true') {
            $signature = Get-AuthenticodeSignature $env:EXE
            if ($signature.Status -ne 'Valid') {
              throw "the executable is not validly signed: $($signature.Status)"
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $env:EXE `
            -DestinationPath dist/oxidgene-desktop-windows-x86_64.zip

      # The download as packaged, without a window: its version, and an MCP
      # session over stdio answering `list_trees` (docs/development.md §6).
      - name: Smoke-test the desktop download
        shell: bash
        run: just desktop-smoke dist/oxidgene-desktop-*

      - name: Upload desktop archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [metadata, publish-images, chart, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The provenance attestations: a Sigstore certificate minted from the
      # job's OIDC token, and the attestations API that stores them.
      id-token: write
      attestations: write
    steps:
      # The packaged artifacts only, never the unsigned executable.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{desktop-*,helm-chart}"
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # SLSA build provenance for every file SHA256SUMS lists, the desktop
      # downloads and the packaged chart: `gh attestation verify <file>
      # --repo trois-six/oxidgene` ties a download to this workflow run and
      # its commit. The images carry theirs in the registry (above).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # The code signing policy must be named on the download page.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          quickstart="$REPOSITORY/blob/$GITHUB_REF_NAME/docs/quickstart.md#1-download-a-desktop-binary"
          if [[ "$SIGNED" == "true" ]]; then
            windows="The Windows executable is signed ([code signing policy]($REPOSITORY#code-signing-policy))."
          else
            windows="The Windows executable is not signed yet: SmartScreen may ask to confirm its first run."
          fi
          NOTES="$windows The macOS application is not signed yet: allow its first opening as the [Quickstart]($quickstart) explains. Verify every download against \`SHA256SUMS\`, and its build provenance with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --notes "$NOTES" \
            --generate-notes \
            --title "OxidGene $GITHUB_REF_NAME"