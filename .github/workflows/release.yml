name: Release

# A release passes every guard first: tiers 1 and 2 (ci.yml, every job
# whatever changed) and tier 3 (nightly.yml) are required gates here
# (docs/development.md §2.8). A push to a `release/**` branch runs the gates
# and builds and smoke-tests the desktop, to rehearse a release; a `v*` tag
# runs them, builds the images and runs the end-to-end suite against them,
# then publishes (docs/development.md §6).

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Tiers 1 and 2
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      all: true

  nightly:
    name: Tier 3
    permissions:
      contents: read
      packages: read
      # Its first job compares a scheduled run with the previous one.
      actions: read
    uses: ./.github/workflows/nightly.yml

  # Tier 3 reports its next-toolchain jobs without failing; everything else
  # it runs must have passed.
  gates:
    name: Release gates
    needs: [ci, nightly]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        run: echo "tiers 1 to 3 passed"

  metadata:
    name: Validate release version
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag against package versions
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "oxidgene-desktop") | .version')"
          chart_version="$(sed -n 's/^appVersion: "\([^"]*\)"$/\1/p' charts/oxidgene/Chart.yaml)"

          if [[ "$GITHUB_REF_NAME" == "$version" || -z "$version" ]]; then
            echo "release tags must start with v" >&2
            exit 1
          fi
          if [[ "$version" != "$cargo_version" ]]; then
            echo "tag version $version does not match Cargo version $cargo_version" >&2
            exit 1
          fi
          if [[ "$version" != "$chart_version" ]]; then
            echo "tag version $version does not match chart appVersion $chart_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The images go to the registry by digest only, untagged: `e2e` tests
  # those very digests, and `publish-images` tags them once it passed.
  images:
    name: Build ${{ matrix.image }} image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oxidgene-server
            dockerfile: docker/Dockerfile.server
          - image: oxidgene-web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      # A matrix job's outputs cannot tell its legs apart: each leg hands its
      # digest on as an artifact named after the image.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.image }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # The Playwright suite of e2e/ against the images just built, started with
  # docker/docker-compose.e2e.yml: PostgreSQL, the server, the web bundle and
  # an ingress serving both from one origin (docs/development.md §2.7).
  e2e:
    name: End-to-end tests of the images
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      E2E_EXTERNAL: "1"
      # One origin: the ingress serves the bundle and the API.
      E2E_API_PORT: "18081"
      E2E_WEB_PORT: "18081"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every later compose command reads them.
      - name: Name the images by digest
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}"
          {
            echo "OXIDGENE_SERVER_IMAGE=$image/oxidgene-server@$(cat digests/oxidgene-server)"
            echo "OXIDGENE_WEB_IMAGE=$image/oxidgene-web@$(cat digests/oxidgene-web)"
          } >> "$GITHUB_ENV"

      - name: Start the images
        run: |
          docker compose -f docker/docker-compose.e2e.yml up -d --wait --wait-timeout 300
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            --output /dev/null "http://127.0.0.1:${E2E_WEB_PORT}/"
          curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:${E2E_WEB_PORT}/healthz"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Save the container logs
        if: failure()
        run: |
          docker compose -f docker/docker-compose.e2e.yml logs --no-color --timestamps > e2e/test-results/containers.log 2>&1 || true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Stop the images
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down --volumes || true

  # The tested digests under the release's version and `latest`. A tag
  # copies the image index whole, its provenance and SBOM with it.
  publish-images:
    name: Publish images
    needs: [metadata, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the images
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for image in oxidgene-server oxidgene-web; do
            name="${REGISTRY}/${{ github.repository_owner }}/$image"
            docker buildx imagetools create \
              --tag "$name:$VERSION" \
              --tag "$name:latest" \
              "$name@$(cat "digests/$image")"
            docker buildx imagetools inspect "$name:$VERSION"
          done

  # Published once the images it deploys passed.
  chart:
    name: Publish Helm chart
    needs: [metadata, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        run: helm dependency build charts/oxidgene

      - name: Lint chart
        run: helm lint charts/oxidgene

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/oxidgene \
            --destination dist \
            --version "${{ needs.metadata.outputs.version }}" \
            --app-version "${{ needs.metadata.outputs.version }}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish chart
        run: |
          helm push "dist/oxidgene-${{ needs.metadata.outputs.version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Upload packaged chart
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  # A rehearsal builds and packages the desktop too, unsigned; a tag signs the
  # Windows executable through SignPath once its version is validated. Signing
  # is on once the repository variable SIGNPATH_ORGANIZATION_ID is set
  # (docs/development.md §6); until then a tag publishes it unsigned.
  desktop:
    name: Build desktop for ${{ matrix.platform }}
    needs: [gates, metadata]
    if: ${{ !cancelled() && needs.gates.result == 'success' && needs.metadata.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    permissions:
      contents: read
      # SignPath reads the job and downloads the unsigned artifact.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain of rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev mold \
            pkg-config zstd

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-desktop-${{ matrix.platform }}

      - name: Build desktop binary
        if: runner.os != 'macOS'
        run: cargo build --locked --release --package oxidgene-desktop

      # One binary per architecture, joined into a universal one by the
      # script (`just build-desktop-macos-app`).
      - name: Build macOS binaries
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --package oxidgene-desktop \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/oxidgene-desktop-linux-x86_64.tar.gz oxidgene-desktop

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          scripts/macos-app.sh dist/oxidgene-desktop-macos-universal.dmg \
            target/aarch64-apple-darwin/release/oxidgene-desktop \
            target/x86_64-apple-darwin/release/oxidgene-desktop

      # SignPath signs what this artifact holds, following the project's
      # artifact configuration and after a manual approval
      # (docs/development.md §6). The artifact is never published.
      - name: Upload unsigned Windows executable
        id: unsigned
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: target/release/oxidgene-desktop.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: oxidgene
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Leaves the approver three hours, within the job's six.
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed
          parameters: |
            version: "${{ needs.metadata.outputs.version }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXE: ${{ env.SIGN == 'true' && 'signed' || 'target/release' }}/oxidgene-desktop.exe
        run: |
          if ($env:SIGN -eq 'true') {
            $signature = Get-AuthenticodeSignature $env:EXE
            if ($signature.Status -ne 'Valid') {
              throw "the executable is not validly signed: $($signature.Status)"
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $env:EXE `
            -DestinationPath dist/oxidgene-desktop-windows-x86_64.zip

      # The download as packaged, without a window: its version, and an MCP
      # session over stdio answering `list_trees` (docs/development.md §6).
      - name: Smoke-test the desktop download
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/desktop-smoke.py dist/oxidgene-desktop-*

      - name: Upload desktop archive
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [metadata, publish-images, chart, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The provenance attestations: a Sigstore certificate minted from the
      # job's OIDC token, and the attestations API that stores them.
      id-token: write
      attestations: write
    steps:
      # The packaged artifacts only, never the unsigned executable.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{desktop-*,helm-chart}"
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # SLSA build provenance for every file SHA256SUMS lists, the desktop
      # downloads and the packaged chart: `gh attestation verify <file>
      # --repo trois-six/oxidgene` ties a download to this workflow run and
      # its commit. The images carry theirs in the registry (above).
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      # The code signing policy must be named on the download page.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          quickstart="$REPOSITORY/blob/$GITHUB_REF_NAME/docs/quickstart.md#1-download-a-desktop-binary"
          if [[ "$SIGNED" == "true" ]]; then
            windows="The Windows executable is signed ([code signing policy]($REPOSITORY#code-signing-policy))."
          else
            windows="The Windows executable is not signed yet: SmartScreen may ask to confirm its first run."
          fi
          NOTES="$windows The macOS application is not signed yet: allow its first opening as the [Quickstart]($quickstart) explains. Verify every download against \`SHA256SUMS\`, and its build provenance with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --notes "$NOTES" \
            --generate-notes \
            --title "OxidGene $GITHUB_REF_NAME"