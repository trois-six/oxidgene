name: Nightly

# Tier 3 of the guards (docs/development.md §2.8): the browser suite, the
# one check worth a daily run that is too slow for a pull request. Nearly
# every commit reaches `main` without one, and nothing else drives the web
# application end to end: a night is the longest a broken page should go
# unseen. It runs every night when `main` moved, on demand, and as a
# required gate of a release (release.yml). A failure here does not block a
# merge; it is the report the maintainer reads in the morning.
#
# Everything heavier — the suites needing PostgreSQL, S3 or Redis, the
# release builds and their budgets, timing, fuzzing, WebKit, the next
# toolchains — runs once a week in weekly.yml.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  # A scheduled run runs only when the branch moved since the previous run
  # of this workflow, cancelled ones aside: the same commit would test the
  # same code again. A run on demand, or as a release gate, always runs.
  changes:
    name: Changes since the last run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.since.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: since
        uses: ./.github/actions/since-last-run
        with:
          workflow: nightly.yml

  # The Playwright suite in Chromium, with the request budgets, the trace
  # continuity and the picture cache.
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/e2e.yml
