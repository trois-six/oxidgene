name: Nightly

# Tier 3 of the guards (docs/development.md §2.8): the checks too slow or
# too noisy for every pull request. They run every night, on demand, and as
# required gates of a release (release.yml). A failure here does not block a
# merge; it is the nightly report the maintainer reads.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  packages: read

jobs:
  # A scheduled run runs only when the branch moved since the previous run
  # of this workflow, cancelled ones aside: the same commit would test the
  # same code again. A run on demand, or as a release gate, always runs.
  changes:
    name: Changes since the last run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.since.outputs.run }}
    steps:
      - name: Compare with the previous run's commit
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")][0].head_sha // empty")
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "Nothing changed since the previous run, at $last: skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  # The Playwright suite, with the request budgets and trace continuity.
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/e2e.yml

  # `just scaling`: the tree-wide computations timed on two tree sizes.
  scaling:
    name: Scaling
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Time the tree-wide computations
        run: cargo nextest run --locked --release -p oxidgene-api --test integration --run-ignored only --no-capture -E 'test(/^algorithm_scaling_test::/)'

  # `just import-memory`: a Geneanet import of a generated tree against its
  # peak and retained memory budgets.
  import-memory:
    name: Import memory
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Measure an import's memory
        run: |
          mkdir -p target/import-memory
          TMPDIR="$PWD/target/import-memory" cargo nextest run --locked --release -p oxidgene-api --test integration --run-ignored only --no-capture -E 'test(/^import_memory_test::/)'

  # The size of every shipped binary and the crates it links, against
  # scripts/budgets.json.
  budgets:
    name: Binary budgets
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: release

      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.1"

      - name: Build the native binaries
        run: cargo build --locked --release -p oxidgene-desktop -p oxidgene-server -p oxidgene-worker

      - name: Build the web bundle
        run: scripts/dx.sh build --package oxidgene-web --platform web --release

      - name: Compare with the budgets
        run: uv run --no-project scripts/budgets.py binaries | tee -a "$GITHUB_STEP_SUMMARY"

  # Dependencies declared and never used, which only a nightly compiler can
  # tell (cargo-udeps).
  udeps:
    name: Unused dependencies (udeps)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps@0.1.61

      - name: Look for unused dependencies
        run: cargo +nightly udeps --locked --workspace --all-targets

  # Reports, never failures: the updates waiting in the lockfile and the
  # major releases our requirements hold back, and the size of the code.
  reports:
    name: Reports
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: aqua:boyter/scc

      - name: Report the dependency updates
        run: |
          rustup toolchain install
          cargo update --dry-run --verbose 2>&1 | tee cargo-update.txt
          {
            echo '## Dependency updates'
            echo '```'
            grep -E 'Updating|Unchanged .*available' cargo-update.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Count the code
        run: |
          scc --exclude-dir target,node_modules --format html-table --output scc.html crates apps e2e scripts
          scc --exclude-dir target,node_modules --by-file --format csv --output scc.csv crates apps e2e scripts
          { echo '## Code size'; echo '```'; scc --exclude-dir target,node_modules crates apps e2e scripts; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            cargo-update.txt
            scc.html
            scc.csv
          retention-days: 90

  # Clippy and the future-incompatibility report on the next Rust releases,
  # weeks before a new lint or a warning turned error breaks the pinned
  # stable toolchain's jobs. Reported, never blocking.
  next-toolchains:
    name: Next toolchain (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy

      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy --locked --workspace --all-targets -- -D warnings

      - name: Future incompatibilities
        if: matrix.toolchain == 'beta'
        run: cargo +beta check --locked --workspace --all-targets --future-incompat-report
