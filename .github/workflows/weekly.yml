name: Weekly

# Tier 4 of the guards (docs/development.md §2.8): what is too heavy for a
# pull request and need not be watched every day. The suites that need a
# service — PostgreSQL, S3, Redis — the API in the desktop's feature set,
# fuzzing, the browser suite outside Chromium, the release builds against
# their budgets, timing and memory, and the reports. It runs once a week
# when `main` moved, on demand, and as a required gate of a release
# (release.yml). A failure here does not block a merge; it is the weekly
# report the maintainer reads.
#
# Every job runs a recipe of the justfile (docs/development.md §2.9). None
# keeps a build cache: one read once a week would be evicted before its
# next use, after pushing out the caches that keep the pull requests fast.

on:
  schedule:
    - cron: "37 2 * * 6"
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debug information, as in ci.yml: smaller objects to compile and link.
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read
  packages: read

jobs:
  # A scheduled run runs only when the branch moved since the previous run
  # of this workflow, cancelled ones aside: the same commit would test the
  # same code again. A run on demand, or as a release gate, always runs.
  changes:
    name: Changes since the last run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.since.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: since
        uses: ./.github/actions/since-last-run
        with:
          workflow: weekly.yml

  # ── Suites that need a service ────────────────────────────────────────

  # The migrations up and down, then the repository and API functional
  # tests on PostgreSQL, each test in a schema of its own, and the jobs and
  # notifications followed across processes: the SQL the web deployments
  # run, which the SQLite suites of ci.yml never execute.
  postgres:
    name: PostgreSQL suite
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      # The release of docker/docker-compose.yml. The tests leave hundreds
      # of schemas, which need more shared memory than Docker's 64 MB.
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: oxidgene
          POSTGRES_PASSWORD: oxidgene
          POSTGRES_DB: oxidgene
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U oxidgene -d oxidgene"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OXIDGENE_TEST_DATABASE_URL: postgres://oxidgene:oxidgene@postgres/oxidgene
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Run the PostgreSQL suite
        run: just test-postgres

  # The session store on Redis: kept, indexed, expired and ended.
  redis:
    name: Redis suite
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      # The release of docker/docker-compose.yml.
      redis:
        image: redis:8-trixie
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OXIDGENE_TEST_REDIS_URL: redis://redis:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Run the Redis suite
        run: just test-redis

  # Media and stored crops on the RustFS of docker/docker-compose.yml, which
  # the recipe starts with its bucket: the tests reach it on the loopback
  # address the Compose stack publishes, so the job runs on the runner
  # itself rather than in the CI image.
  s3:
    name: S3 suite
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      # The toolchain of rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      # A prebuilt binary; the version of mise.toml.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest@0.9.148

      - name: Run the S3 suite
        run: just test-s3

  # ── Builds no other tier tests ────────────────────────────────────────

  # The API with the features the desktop gives it. The workspace build of
  # ci.yml unifies the server's features into the API, so this
  # configuration is linted there (Clippy, api without graphql) and tested
  # only here.
  #
  # Reported, not blocking yet: of the 907 tests of that build, the 221 that
  # call `/graphql` fail with a 404, since they are not compiled out
  # without the `graphql` feature; the 686 others pass. Remove
  # `continue-on-error` once those tests are gated behind the feature
  # (docs/roadmap.md §12c).
  desktop-api:
    name: API tests in the desktop's feature set
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Run the API tests as the desktop builds it
        run: just test-desktop-api

  # The Geneanet session decoder under libFuzzer, on synthetic inputs, for
  # a quarter of an hour. A crash fails the job and leaves its input as an
  # artifact, to reproduce with a plain, anonymized test.
  fuzz:
    name: Fuzz the session decoder
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      # The version of mise.toml.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz
        run: just fuzz 900

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/oxidgene-geneanet/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30

  # The Playwright suite outside Chromium, the engine the nightly run
  # drives: WebKit is the engine of the desktop's window on Linux and
  # macOS and of Safari. A project the Playwright configuration does not
  # define yet is reported and skipped.
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # A project and the browsers Playwright installs for it; the touch
        # project joins this list under its name once it is defined.
        include:
          - project: webkit
            browsers: webkit
    uses: ./.github/workflows/e2e.yml
    with:
      project: ${{ matrix.project }}
      browsers: ${{ matrix.browsers }}

  # A generated tree of 100,000 persons imported, rebuilt, read, edited and
  # exported against its time and memory budgets (docs/development.md
  # §2.1). The million-person run needs more memory than a hosted runner
  # has, and stays a recipe run by hand.
  scale-large:
    name: Large trees
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Run the large-tree scale tests
        run: just scale-large

  # ── Budgets, timing and reports ───────────────────────────────────────

  # The tree-wide computations timed on two tree sizes, then a Geneanet
  # import of a generated tree against its peak and retained memory
  # budgets: two recipes of one release build.
  timing:
    name: Scaling and import memory
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Time the tree-wide computations
        run: just scaling

      - name: Measure an import's memory
        if: ${{ !cancelled() }}
        run: just import-memory

  # The size of every shipped binary and the crates it links, against
  # scripts/budgets.json.
  budgets:
    name: Binary budgets
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: dioxus-cli@0.7.10

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.7"

      # The native binaries and the web bundle, built in release mode, then
      # compared; the script adds its table to the run's summary.
      - name: Build what ships and compare it with the budgets
        run: just budgets

  # Dependencies declared and never used, which only a nightly compiler can
  # tell (cargo-udeps).
  udeps:
    name: Unused dependencies (udeps)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-udeps@0.1.61

      - name: Look for unused dependencies
        run: just udeps

  # Reports, never failures: the updates waiting in the lockfile and the
  # major releases our requirements hold back, and the size of the code.
  reports:
    name: Reports
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: aqua:boyter/scc

      - name: Report the dependency updates
        run: |
          rustup toolchain install
          just report-updates 2>&1 | tee cargo-update.txt
          {
            echo '## Dependency updates'
            echo '```'
            grep -E 'Updating|Unchanged .*available' cargo-update.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Count the code
        run: |
          just report-size --format html-table --output scc.html
          just report-size --by-file --format csv --output scc.csv
          { echo '## Code size'; echo '```'; just report-size; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            cargo-update.txt
            scc.html
            scc.csv
          retention-days: 90

  # Clippy and the future-incompatibility report on the next Rust releases,
  # weeks before a new lint or a warning turned error breaks the pinned
  # stable toolchain's jobs. Reported, never blocking.
  next-toolchains:
    name: Next toolchain (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Install the toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy

      - name: Clippy
        run: just next-toolchain ${{ matrix.toolchain }}

      - name: Future incompatibilities
        if: matrix.toolchain == 'beta'
        run: just future-incompat beta
