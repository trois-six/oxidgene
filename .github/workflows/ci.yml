name: CI

# Tiers 1 and 2 of the guards (docs/development.md §2.8): every check here
# blocks a merge through the `CI` job at the end. The heavy tier 3 — end to
# end, budgets, timing, reports, next toolchains — runs in nightly.yml, every
# night and on demand; release.yml runs both as gates.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      all:
        description: Run every job whatever changed (a release)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci_image: ${{ steps.filter.outputs.ci_image }}
      code: ${{ inputs.all && 'true' || steps.filter.outputs.code }}
      containers: ${{ steps.filter.outputs.containers }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # With the default `some`, a `!` pattern matches every file outside
          # it, so `code` matched documentation too. This quantifier treats
          # the `!` patterns as exclusions; filters without one are unchanged.
          predicate-quantifier: some-with-excludes
          filters: |
            ci_image:
              - 'docker/Dockerfile.ci'
              - 'rust-toolchain.toml'
              - '.github/workflows/build-ci-image.yml'
            containers:
              - 'docker/**'
            helm:
              - 'charts/oxidgene/**'
            # Anything except documentation. Docs-only commits skip the cargo jobs.
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  build-image:
    name: Rebuild CI image
    needs: changes
    # Only ever rebuilds on a real push to main (post-merge) — never on pull_request,
    # so a PR (even from a fork with a restricted token) can never push to :latest.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.ci_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-ci-image.yml

  # ── Tier 1 ────────────────────────────────────────────────────────────

  check:
    name: Check
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check
        run: cargo check --locked --workspace --all-targets

  fmt:
    name: Format
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `just clippy`: every native target with every default feature.
          - name: workspace
            args: --workspace --all-targets
          # `just wasm`: the browser binary, the only build of the shared UI
          # for WebAssembly.
          - name: wasm
            args: -p oxidgene-web --target wasm32-unknown-unknown --all-targets
          # The desktop without telemetry, the build whose `cfg`s differ most.
          - name: desktop without default features
            args: -p oxidgene-desktop --no-default-features --all-targets
          # The API alone, as the desktop links it: without GraphQL.
          - name: api without graphql
            args: -p oxidgene-api --all-targets
          # The archive crate's native transport, which no member enables yet.
          - name: archives native transport
            args: -p oxidgene-archives --features native --all-targets
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          key: ${{ matrix.name }}

      - name: Clippy
        run: cargo clippy --locked ${{ matrix.args }} -- -D warnings

  unit:
    name: Unit tests
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      # `just test-unit`: the `#[cfg(test)]` modules, then the doc examples.
      - name: Run the unit tests
        run: cargo nextest run --locked --workspace --lib --bins --no-fail-fast

      - name: Run the documentation examples
        run: cargo test --locked --workspace --doc

  # The guards that read the repository rather than run it, specifications
  # included, so it runs on documentation-only changes too. On a pull
  # request it also checks that every edited specification carries a new
  # `generated.at`.
  specs:
    name: Repository guards
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the source guards
        env:
          OXIDGENE_SPEC_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -z "$OXIDGENE_SPEC_BASE" ]; then unset OXIDGENE_SPEC_BASE; fi
          cargo nextest run --locked -p oxidgene-guards --no-fail-fast

  machete:
    name: Unused dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A prebuilt binary; the version of mise.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2

      - name: Look for unused dependencies
        run: cargo machete

  cyclomatic:
    name: Cyclomatic complexity
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"

      # `just cyclomatic`: no function above a cyclomatic complexity of 15.
      - name: Check the cyclomatic complexity
        run: uv run --quiet scripts/cyclomatic.py -l rust -C 15 -w crates apps -x "*/target/*"

  # ── Tier 2 ────────────────────────────────────────────────────────────

  # The integration test targets, the database guards of `guards_test`
  # included: cross-tree access, pagination, purge, history, log privacy,
  # REST/GraphQL parity, and the statement counts of `query_scaling_test`.
  functional:
    name: Functional tests
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      # `just test-functional`: the integration test targets.
      - name: Run the functional tests
        run: cargo nextest run --locked --workspace --test '*' --no-fail-fast

  sql-plans:
    name: SQL plans
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      # `just sql-plans`: no statement scans a large table without an index.
      - name: Read the query plans
        run: cargo nextest run --locked -p oxidgene-api --features graphql --test guards_test --run-ignored only -E 'test(no_statement_scans_a_large_table)'

  dependencies:
    name: Dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Advisories, licences, bans and sources, as deny.toml sets them.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit the lockfile
        run: cargo audit

      # The duplicated crates of the graph against their budget.
      - name: Check the duplicate budget
        run: python3 scripts/budgets.py dependencies

  duplication:
    name: Code duplication
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"

      - name: Check the duplicate rate
        run: uv run --quiet scripts/duplication.py

  ui-js:
    name: UI JavaScript tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `just ui-js`: the browser glue, without dependencies.
      - name: Run the JavaScript unit tests
        run: node --test crates/oxidgene-ui/tests/*.test.mjs

  containers:
    name: Build ${{ matrix.name }} image
    needs: changes
    # These builds gate Renovate automerge. Tagged releases rebuild and publish
    # the production images in release.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/automerge-') && needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CI
            dockerfile: docker/Dockerfile.ci
          - name: server
            dockerfile: docker/Dockerfile.server
          - name: web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=validate-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.name }}

  helm:
    name: Validate Helm chart
    needs: changes
    # Tagged releases rebuild, lint and package the chart in release.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/automerge-') && needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        run: helm dependency build charts/oxidgene

      - name: Lint chart
        run: helm lint charts/oxidgene

      - name: Render chart
        run: helm template oxidgene charts/oxidgene > /dev/null

  # A single required status check.
  #
  # The jobs above are skipped on a docs-only change, and a skipped job reports
  # as "skipped" rather than "success" — so making them the required checks
  # would leave every documentation pull request unmergeable. This one always
  # runs, and passes when each of them either succeeded or was legitimately
  # skipped. Point branch protection at this, not at the jobs it gathers.
  ci-ok:
    name: CI
    if: always()
    needs:
      - check
      - fmt
      - clippy
      - unit
      - specs
      - machete
      - cyclomatic
      - functional
      - sql-plans
      - dependencies
      - duplication
      - ui-js
      - containers
      - helm
    runs-on: ubuntu-latest
    steps:
      - name: Verify that nothing failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job reported '$result'"; exit 1 ;;
            esac
          done
