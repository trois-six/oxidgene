name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci_image: ${{ steps.filter.outputs.ci_image }}
      code: ${{ steps.filter.outputs.code }}
      containers: ${{ steps.filter.outputs.containers }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci_image:
              - 'docker/Dockerfile.ci'
              - '.github/workflows/build-ci-image.yml'
            containers:
              - 'docker/**'
            helm:
              - 'charts/oxidgene/**'
            # Anything except documentation. Docs-only commits skip the cargo jobs.
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  build-image:
    name: Rebuild CI image
    needs: changes
    # Only ever rebuilds on a real push to main (post-merge) — never on pull_request,
    # so a PR (even from a fork with a restricted token) can never push to :latest.
    if: github.event_name == 'push' && needs.changes.outputs.ci_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-ci-image.yml

  check:
    name: Check
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Check
        run: cargo check --locked --workspace --all-targets

  fmt:
    name: Format
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Run tests
        run: cargo nextest run --locked --workspace

  containers:
    name: Build ${{ matrix.name }} image
    needs: changes
    # These builds gate Renovate automerge. Tagged releases rebuild and publish
    # the production images in release.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/automerge-') && needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CI
            dockerfile: docker/Dockerfile.ci
          - name: server
            dockerfile: docker/Dockerfile.server
          - name: web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=validate-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.name }}

  helm:
    name: Validate Helm chart
    needs: changes
    # Tagged releases rebuild, lint and package the chart in release.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/automerge-') && needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Build chart dependencies
        run: helm dependency build charts/oxidgene

      - name: Lint chart
        run: helm lint charts/oxidgene

      - name: Render chart
        run: helm template oxidgene charts/oxidgene > /dev/null

  # A single required status check.
  #
  # The jobs above are skipped on a docs-only change, and a skipped job reports
  # as "skipped" rather than "success" — so making them the required checks
  # would leave every documentation pull request unmergeable. This one always
  # runs, and passes when each of them either succeeded or was legitimately
  # skipped. Point branch protection at this, not at the four.
  ci-ok:
    name: CI
    if: always()
    needs: [check, fmt, clippy, test, containers, helm]
    runs-on: ubuntu-latest
    steps:
      - name: Verify that nothing failed
        run: |
          results="${{ needs.check.result }} ${{ needs.fmt.result }} \
                   ${{ needs.clippy.result }} ${{ needs.test.result }} \
                   ${{ needs.containers.result }} ${{ needs.helm.result }}"
          echo "results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job reported '$result'"; exit 1 ;;
            esac
          done
