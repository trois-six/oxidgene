name: CI

# Tiers 1 and 2 of the guards (docs/development.md §2.8): every check here
# blocks a merge through the `CI` job at the end, and all of them are fast
# once the build cache is warm. Together they run what `just check` runs,
# which the `workflows` guard keeps so. The browser suite runs every night
# (nightly.yml, tier 3) and what is heavy once a week (weekly.yml, tier 4);
# release.yml runs every tier as a gate.
#
# Every checking step runs a recipe of the justfile (`just <recipe>`), the
# command a developer runs: nothing here retypes a cargo, npm or uv command
# (docs/development.md §2.9, and the `workflows` guard).
#
# The jobs that compile restore their build through
# .github/actions/rust-build-cache: the dependencies whole, then the
# workspace crates of the last build of `main`, so that a push recompiles
# only the crates it touched and those depending on them. Only `main` saves.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      all:
        description: Run every job whatever changed (a release)
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # No debug information in CI: a test failure reports its panic message and
  # its backtrace's function names, and the objects to compile, link and
  # cache are a fraction of the size. Local builds keep line tables.
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci_image: ${{ steps.filter.outputs.ci_image }}
      code: ${{ inputs.all && 'true' || steps.filter.outputs.code }}
      containers: ${{ steps.filter.outputs.containers }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # With the default `some`, a `!` pattern matches every file outside
          # it, so `code` matched documentation too. This quantifier treats
          # the `!` patterns as exclusions; filters without one are unchanged.
          predicate-quantifier: some-with-excludes
          filters: |
            ci_image:
              - 'docker/Dockerfile.ci'
              - 'rust-toolchain.toml'
              - '.github/workflows/build-ci-image.yml'
            containers:
              - 'docker/**'
            helm:
              - 'charts/oxidgene/**'
            # Anything except documentation. Docs-only commits skip the cargo jobs.
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  build-image:
    name: Rebuild CI image
    needs: changes
    # Only ever rebuilds on a real push to main (post-merge) — never on pull_request,
    # so a PR (even from a fork with a restricted token) can never push to :latest.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.ci_image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-ci-image.yml

  # ── Tier 1 ────────────────────────────────────────────────────────────

  fmt:
    name: Format
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Check formatting
        run: just fmt-check

  clippy:
    name: Clippy (${{ matrix.name }})
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One recipe per build variant; `just clippy` runs the native ones.
        include:
          # Every native target with every default feature.
          - name: workspace
            recipe: clippy-workspace
          # The browser binary, the only build of the shared UI for
          # WebAssembly.
          - name: wasm
            recipe: wasm
          # The desktop without telemetry, the build whose `cfg`s differ most.
          - name: desktop without default features
            recipe: clippy-desktop-minimal
          # The API alone, as the desktop links it: without GraphQL.
          - name: api without graphql
            recipe: clippy-api
          # The archive crate's live checks, which no member enables.
          - name: archives live checks
            recipe: clippy-archives
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - id: cache
        uses: ./.github/actions/rust-build-cache
        with:
          key: clippy ${{ matrix.name }}

      - name: Clippy
        run: just ${{ matrix.recipe }}

      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}

  unit:
    name: Unit tests
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - id: cache
        uses: ./.github/actions/rust-build-cache
        with:
          key: unit

      # The `#[cfg(test)]` modules, then the documentation examples.
      - name: Run the unit tests
        run: just test-unit

      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}

  # The rustdoc the documentation site publishes, warnings denied: a broken
  # or private intra-doc link fails here rather than in the Pages job, after
  # the merge.
  doc:
    name: Rustdoc
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - id: cache
        uses: ./.github/actions/rust-build-cache
        with:
          key: doc

      - name: Build the documentation
        run: just doc-check

      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}

  # The guards that read the repository rather than run it, specifications
  # included, so it runs on documentation-only changes too. On a pull
  # request it also checks that every edited specification carries a new
  # `generated.at`.
  specs:
    name: Repository guards
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-just

      # Empty outside a pull request, which the guard reads as unset.
      - name: Run the source guards
        env:
          OXIDGENE_SPEC_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just guards

  cyclomatic:
    name: Cyclomatic complexity
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.7"

      # No function above a cyclomatic complexity of 15.
      - name: Check the cyclomatic complexity
        run: just cyclomatic

  # ── Tier 2 ────────────────────────────────────────────────────────────

  # The integration test targets, the database guards of oxidgene-api
  # included: cross-tree access, pagination, purge, history, log privacy,
  # REST/GraphQL parity, and the statement counts of `query_scaling_test`;
  # then the SQL plans, from the same build.
  functional:
    name: Functional tests
    needs: [changes, build-image]
    if: always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && (needs.changes.outputs.code == 'true' || needs.changes.outputs.ci_image == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/ci-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      # The test executables are not kept: one per crate, they relink in seconds.
      - id: cache
        uses: ./.github/actions/rust-build-cache
        with:
          key: functional

      # The integration test targets.
      - name: Run the functional tests
        run: just test-functional

      # No statement scans a large table without an index: one more test of
      # the build the step above left.
      - name: Read the query plans
        run: just sql-plans

      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}

  dependencies:
    name: Dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      # Prebuilt binaries; the versions of mise.toml.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2,cargo-audit@0.22.2

      # No unused dependency; no advisory, licence, ban or source deny.toml
      # refuses; no known vulnerability; the duplicated crates of the graph
      # within their budget.
      - name: Check the dependency graph
        run: just deps

  duplication:
    name: Code duplication
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.7"

      - name: Check the duplicate rate
        run: just duplication

  ui-js:
    name: UI JavaScript tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The browser glue, without dependencies.
      - name: Run the JavaScript unit tests
        run: just ui-js

  containers:
    name: Build ${{ matrix.name }} image
    needs: changes
    # These builds check Renovate's pull requests that touch docker/: the
    # ones it merges by itself and the ones that wait for a review, as every
    # update of the published images' Dockerfiles does (renovate.json).
    # Tagged releases rebuild and publish the production images in
    # release.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CI
            dockerfile: docker/Dockerfile.ci
            target: ""
            then: ""
          # Two targets of one Dockerfile, built one after the other: the
          # second reuses the builder stage of the first.
          - name: backend
            dockerfile: docker/Dockerfile.backend
            target: server
            then: worker
          - name: web
            dockerfile: docker/Dockerfile.web
            target: ""
            then: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Validate Compose configuration
        run: just compose-check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=validate-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.name }}

      - name: Build the second target
        if: matrix.then != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.then }}
          push: false
          cache-from: type=gha,scope=validate-${{ matrix.name }}

  helm:
    name: Validate Helm chart
    needs: changes
    # Tagged releases rebuild, lint and package the chart in release.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/automerge-') && needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.7"

      # Lint with every values file of charts/oxidgene/ci, and render each
      # authentication mode, the values it requires and refuses, and the
      # realm it ships (scripts/chart-tests.py).
      - name: Lint and test the chart
        run: just chart-test

  # A single required status check.
  #
  # The jobs above are skipped on a docs-only change, and a skipped job reports
  # as "skipped" rather than "success" — so making them the required checks
  # would leave every documentation pull request unmergeable. This one always
  # runs, and passes when each of them either succeeded or was legitimately
  # skipped. Point branch protection at this, not at the jobs it gathers.
  ci-ok:
    name: CI
    if: always()
    needs:
      - fmt
      - clippy
      - unit
      - doc
      - specs
      - cyclomatic
      - functional
      - dependencies
      - duplication
      - ui-js
      - containers
      - helm
    runs-on: ubuntu-latest
    steps:
      - name: Verify that nothing failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job reported '$result'"; exit 1 ;;
            esac
          done
