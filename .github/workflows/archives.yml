name: Archive portals

# The live end-to-end checks of the archive portals (docs/archives.md §9.1,
# §9.2): every week and on demand, each catalogued archive with an adapter
# against its real portal, through scripts/archives-live.sh (`just
# archives-live`). Not part of the nightly workflow, not a required status
# check, and no release waits for it: a portal changing is not a defect of a
# commit.
#
# One job per portal address: archives whose portals share one — several
# services hosted by one vendor, which rate-limits them together — are
# checked in one job, one after another with a pause between them; the
# others each in a job of their own. Requests are sequential and never
# retried. A drift, or a portal unreachable on two scheduled runs in a row,
# opens an issue labelled `archive-drift` for that archive or comments on
# the open one; an `ok` run closes it.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      archive:
        description: Archive id, such as fr-ad44; empty for every archive
        type: string
        required: false
        default: ""

concurrency:
  group: archive-portals
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v7

      # The archives `live::archives` of oxidgene-archives checks: those with
      # a collection, whose catalogue entry does not set `live_check: false`.
      - name: List the archives
        id: plan
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: |
          archives=$(jq -c -s --arg only "${ARCHIVE:-}" '[.[]
            | select((.collections // []) | length > 0)
            | select(.live_check != false)
            | .id
            | select($only == "" or . == $only)]' assets/archives/*/*.json)
          if [ -n "${ARCHIVE:-}" ] && [ "$archives" = "[]" ]; then
            echo "::error::$ARCHIVE is not a catalogued archive with an adapter and live checks"
            exit 1
          fi
          # Grouped by the address their portal resolves to (its host name
          # when it does not resolve), in catalogue order within a group.
          groups=$(jq -r '.[]' <<<"$archives" | while read -r id; do
            origin=$(jq -r --arg id "$id" 'select(.id == $id) | .collections[0].portal.origin' assets/archives/*/*.json)
            host=${origin#*://}
            host=${host%%[:/]*}
            address=$(getent ahostsv4 "$host" | awk 'NR == 1 { print $1 }' || true)
            echo "${address:-$host} $id"
          done | sort -s -k1,1 | jq -R -s -c 'split("\n") | map(select(length > 0) | split(" "))
            | group_by(.[0]) | map({key: .[0][1], archives: (map(.[1]) | join(" ")), name: (.[0][1] + (if length > 1 then " and \(length - 1) more" else "" end))})')
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.group.name }}
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    # Up to fifteen archives of one address (one vendor's hosting), each
    # paused before; GitHub ends a job at six hours.
    timeout-minutes: 330
    permissions:
      contents: read
      # The report of the previous scheduled run.
      actions: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7

      # The toolchain of rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      # A prebuilt binary; the version of mise.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Fails on a drift only; an unreachable or challenged portal is left
      # to the report.
      # Several archives of one address are checked one after another,
      # paused between them, each into target/archives-live/<archive id>/.
      - name: Check the portals
        env:
          ARCHIVES: ${{ matrix.group.archives }}
        run: |
          read -ra archives <<<"$ARCHIVES"
          scripts/archives-live.sh "${archives[@]}"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archives-live-${{ matrix.group.key }}
          path: target/archives-live/
          if-no-files-found: ignore
          # Long enough for the next weekly run to read it.
          retention-days: 15

      # Portal pages only, kept a few days.
      - name: Upload the Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archives-live-traces-${{ matrix.group.key }}
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 5

      - name: Open, comment on or close the archives' issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVES: ${{ matrix.group.archives }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The outcome of an archive in the report files given.
          outcome_in() {
            local id="$1"
            shift
            jq -r --arg id "$id" '.archives[] | select(.archive == $id) | .outcome' "$@" 2>/dev/null | head -n 1 || true
          }
          # The reports of the previous scheduled run, whatever its groups.
          previous_reports() {
            if [ "$EVENT" != schedule ] || [ -d previous ]; then
              return 0
            fi
            mkdir -p previous
            local run
            run=$(gh run list --workflow archives.yml --event schedule --status completed --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run" ]; then
              gh run download "$run" --pattern 'archives-live-fr-*' --dir previous || true
            fi
          }

          handle() {
            local ARCHIVE="$1" report outcome title number previous catalogue
            report=target/archives-live/$ARCHIVE/report.json
            [ -f "$report" ] || report=target/archives-live/report.json
            outcome=$(outcome_in "$ARCHIVE" "$report")
            if [ -z "$outcome" ]; then
              echo "::warning::$ARCHIVE: the check ended without a report"
              return 0
            fi
            title="Archive portal drift: $ARCHIVE"
            number=$(gh issue list --state open --label archive-drift --limit 100 --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)

            case "$outcome" in
              ok)
                if [ -n "$number" ]; then
                  gh issue close "$number" --comment "The live check of \`$ARCHIVE\` passed: $RUN_URL"
                fi
                return 0
                ;;
              challenged)
                echo "::warning::$ARCHIVE: an anti-bot challenge blocked the headless browser; unverified"
                return 0
                ;;
              unreachable)
                previous_reports
                previous=""
                mapfile -t reports < <(find previous -name report.json 2>/dev/null)
                if [ "${#reports[@]}" -gt 0 ]; then
                  previous=$(outcome_in "$ARCHIVE" "${reports[@]}")
                fi
                if [ "$previous" != unreachable ]; then
                  echo "::warning::$ARCHIVE: the portal could not be reached"
                  return 0
                fi
                ;;
            esac

            catalogue=$(for file in assets/archives/*/*.json; do
              jq -e --arg id "$ARCHIVE" '.id == $id' "$file" >/dev/null && echo "$file"
            done || true)
            {
              echo "The live check of \`$ARCHIVE\` ended in \`$outcome\` ($RUN_URL)."
              echo
              echo "| Collection | Outcome | Step | Expected | Received |"
              echo "|---|---|---|---|---|"
              jq -r --arg id "$ARCHIVE" '.archives[] | select(.archive == $id) | .collections[]
                | select(.failure) | [.collection, .outcome, .failure.step, .failure.expected, .failure.received]
                | map(gsub("\\|"; "\\|")) | "| " + join(" | ") + " |"' "$report"
              echo
              echo "Catalogue entry: \`$catalogue\`."
              jq -r --arg id "$ARCHIVE" '.archives[] | select(.archive == $id) | [.collections[].platform] | unique[]
                | "Adapter: `crates/oxidgene-archives/src/platform/\(.)/`, viewer in `crates/oxidgene-archives/src/platform/viewers.json`."' "$report"
              echo
              echo "A drift is fixed in the collection's \`portal\` settings, or in the adapter and its fixtures when the platform itself changed (docs/archives.md §9.2)."
            } > issue.md

            gh label create archive-drift --color D93F0B \
              --description "A live check found an archive portal changed or unreachable" 2>/dev/null || true
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file issue.md
            else
              gh issue create --title "$title" --label archive-drift --body-file issue.md
            fi
          }

          read -ra archives <<<"$ARCHIVES"
          for archive in "${archives[@]}"; do
            handle "$archive"
          done
