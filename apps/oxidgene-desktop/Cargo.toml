[package]
name = "oxidgene-desktop"
description = "OxidGene desktop application (Axum + SQLite + Dioxus WebView)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["telemetry"]
telemetry = ["dep:oxidgene-observability", "dep:tower-http", "oxidgene-api/telemetry-context", "oxidgene-ui/telemetry-client"]

# Embed the .ico as a Windows resource (IDI_APPLICATION / 32512) so that
# Explorer shows the OxidGene icon and Dioxus's default_icon() picks it up.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# WebKitGTK derives a few of its own default paths (notably HSTS storage)
# from GLib's program name instead of the WebView data directory we pass to
# wry — see the `glib::set_prgname` call in `main.rs`.
# Tao supports GTK 4 (tauri-apps/tao#1258), but Wry support is pending
# (tauri-apps/wry#1767). Keep these on GTK 3 until Dioxus Desktop consumes a
# compatible Wry release; GLib 0.22 object types are incompatible with GTK 3.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
glib = { version = "0.18", default-features = false }
gtk = { version = "0.18", default-features = false }

[dependencies]
oxidgene-api = { workspace = true }
oxidgene-db = { workspace = true }
oxidgene-observability = { workspace = true, optional = true }
oxidgene-ui = { workspace = true }
oxidgene-geneanet = { workspace = true }
serde = { workspace = true }
# The window hands media over base64-encoded; they are written as bytes.
base64 = { workspace = true }
# The Geneanet login window reports back across the event loop boundary.
futures-channel = "0.3"
dioxus = { workspace = true, features = ["desktop", "router"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "sync"] }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
dirs = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
