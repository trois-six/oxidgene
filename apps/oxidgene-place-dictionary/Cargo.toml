[package]
name = "oxidgene-place-dictionary"
description = "Generates the place dictionary from open data"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
# Folding names from two sources the way the application compares them.
oxidgene-core = { workspace = true }
# Compresses the dictionary the way every embedded file is compressed.
brotli = { workspace = true }
# Downloads the open-data sources; already the workspace HTTP client.
reqwest = { workspace = true }
# geo.api.gouv.fr answers in JSON.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
# The ONS Index of Place Names ships as a ZIP archive.
zip = { workspace = true }
