[package]
name = "oxidgene-web"
description = "OxidGene browser frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# A browser binary: nothing here is built for a native target (see main.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
oxidgene-ui = { workspace = true, features = ["telemetry-client"] }
opentelemetry = { workspace = true }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
opentelemetry_sdk = { workspace = true }
prost = "0.14"
reqwest = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-wasm = "0.2"
futures-channel = "0.3"
futures-util = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
# Not called: `rand`, which the OpenTelemetry SDK draws its trace ids from,
# reaches the browser's crypto API through getrandom 0.3 only with its
# `wasm_js` feature, and this is where the binary turns it on.
getrandom = { version = "0.4", features = ["wasm_js"] }

# getrandom is a dependency for its feature alone, which cargo-machete cannot
# see.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
