{{- if .Values.ingress.enabled }}
{{- if and (not (include "oxidgene.authEnabled" .)) (not .Values.ingress.exposeApiWithoutAuth) }}
{{- fail "ingress.enabled with auth.idp.mode=none routes /api and /graphql to a backend without authentication: anyone who reaches the Ingress can read and change every tree. Choose an identity provider (auth.idp.mode=external or keycloak-operator), or restrict the Ingress to trusted users (an authenticating proxy through ingress.annotations, a private network) and then set ingress.exposeApiWithoutAuth=true to acknowledge it." }}
{{- end }}
{{- $backend := dict "service" (dict "name" (printf "%s-backend" (include "oxidgene.fullname" .)) "port" (dict "number" .Values.backend.service.port)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oxidgene.fullname" . }}
  labels:
    {{- include "oxidgene.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      http:
        paths:
          {{- /* The API, the sign-in routes, the assistant endpoint and its
          protected-resource metadata share the frontend's origin
          (docs/authentication.md §8.1). */}}
          {{- range list "/api" "/graphql" "/auth" "/mcp" "/.well-known/oauth-protected-resource" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              {{- toYaml $backend | nindent 14 }}
          {{- end }}
          - path: /healthz
            pathType: Exact
            backend:
              {{- toYaml $backend | nindent 14 }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oxidgene.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
