{{- if not (has .Values.s3.mode (list "disabled" "existing" "rustfs")) }}
{{- fail "s3.mode must be disabled, existing, or rustfs" }}
{{- end }}
{{- if not (has .Values.database.mode (list "disabled" "existing" "cloudnativepg")) }}
{{- fail "database.mode must be disabled, existing, or cloudnativepg" }}
{{- end }}
{{- if not (has .Values.redis.mode (list "disabled" "existing" "operator")) }}
{{- fail "redis.mode must be disabled, existing, or operator" }}
{{- end }}
{{- $usesLocalState := or (eq .Values.database.mode "disabled") (eq .Values.s3.mode "disabled") }}
{{- if and $usesLocalState .Values.autoscaling.backend.enabled }}
{{- fail "backend autoscaling requires PostgreSQL and S3; disable autoscaling when database.mode or s3.mode is disabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxidgene.fullname" . }}-backend
  labels:
    {{- include "oxidgene.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.backend.enabled }}
  replicas: {{ ternary 1 .Values.backend.replicaCount $usesLocalState }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oxidgene.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        {{- toYaml .Values.backend.podAnnotations | nindent 8 }}
      labels:
        {{- include "oxidgene.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "oxidgene.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ default .Chart.AppVersion .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OXIDGENE_HOST
              value: "0.0.0.0"
            - name: OXIDGENE_PORT
              value: "8080"
            - name: OXIDGENE_LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            - name: OXIDGENE_CORS_ORIGIN
              value: {{ .Values.backend.corsOrigin | quote }}
            {{- with .Values.backend.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: OXIDGENE_DATABASE_URL
              {{- if eq .Values.database.mode "disabled" }}
              value: {{ printf "sqlite://%s/%s?mode=rwc" (trimSuffix "/" .Values.database.sqlite.directory) .Values.database.sqlite.fileName | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "database credential Secret is required" (include "oxidgene.databaseSecretName" .) }}
                  key: {{ required "database URL key is required" (include "oxidgene.databaseUrlKey" .) }}
              {{- end }}
            {{- if ne .Values.redis.mode "disabled" }}
            - name: OXIDGENE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "Redis credential Secret is required" (include "oxidgene.redisSecretName" .) }}
                  key: {{ required "Redis URL key is required" (include "oxidgene.redisUrlKey" .) }}
            {{- end }}
            {{- if eq .Values.s3.mode "disabled" }}
            - name: OXIDGENE_MEDIA_BACKEND
              value: filesystem
            - name: OXIDGENE_MEDIA_ROOT
              value: {{ required "s3.filesystem.root is required" .Values.s3.filesystem.root | quote }}
            {{- else }}
            - name: OXIDGENE_MEDIA_BACKEND
              value: s3
            {{- $endpoint := include "oxidgene.s3Endpoint" . }}
            {{- if $endpoint }}
            - name: OXIDGENE_S3_ENDPOINT
              value: {{ $endpoint | quote }}
            {{- end }}
            - name: OXIDGENE_S3_BUCKET
              value: {{ include "oxidgene.s3Bucket" . | quote }}
            - name: OXIDGENE_S3_REGION
              value: {{ include "oxidgene.s3Region" . | quote }}
            - name: OXIDGENE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "oxidgene.s3CredentialsSecret" . }}
                  key: {{ include "oxidgene.s3AccessKeyKey" . }}
            - name: OXIDGENE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "oxidgene.s3CredentialsSecret" . }}
                  key: {{ include "oxidgene.s3SecretKeyKey" . }}
            {{- end }}
            - name: TMPDIR
              value: /tmp
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.database.mode "disabled" }}
            - name: database
              mountPath: {{ required "database.sqlite.directory is required" .Values.database.sqlite.directory | quote }}
            {{- end }}
            {{- if eq .Values.s3.mode "disabled" }}
            - name: media
              mountPath: {{ required "s3.filesystem.root is required" .Values.s3.filesystem.root | quote }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.database.mode "disabled" }}
        - name: database
          emptyDir: {}
        {{- end }}
        {{- if eq .Values.s3.mode "disabled" }}
        - name: media
          emptyDir: {}
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxidgene.fullname" . }}-backend
  labels:
    {{- include "oxidgene.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "oxidgene.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
