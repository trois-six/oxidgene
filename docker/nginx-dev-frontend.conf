# The development overlay's front (docker-compose.dev.yml): one origin,
# http://localhost:8081, as in docker-compose.yml. The API, sign-in and
# assistant paths go to the server (nginx-dev-proxy.conf, included below);
# everything else to `dx serve` in the frontend container, its hot-reload
# WebSocket included. No bundle is served from here, so none of the
# published image's precompression or security headers apply.

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 8080;
    server_name _;

    include /etc/nginx/locations.d/*.conf;

    location / {
        # Looked up at request time: the frontend container is recreated
        # with a new address while this one keeps running.
        set $frontend http://frontend:8080;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
