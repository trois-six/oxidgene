# Security headers of every page and asset the web frontend serves.
#
# The policy is the one the WebAssembly application needs and nothing more:
# - scripts come from this origin only. 'wasm-unsafe-eval' compiles the
#   WebAssembly; 'unsafe-eval' is Dioxus' `document::eval`, which runs its
#   snippets through `new Function`. No inline script is allowed: the release
#   bundle has none.
# - styles may be inline: the application writes its stylesheets and style
#   attributes from WebAssembly.
# - images and video or audio come from this origin and from
#   $csp_connect_src — a held picture is drawn from its versioned API
#   address, and the API may be elsewhere —, from data: and blob: (inline
#   pictures, the gallery's PDF previews), and from any https: origin: a
#   medium held only as a URL is shown from its own origin, and no static
#   policy can name the hosts each tree trusts. The application decides
#   host by host which of them it loads, and never a private or local
#   address (docs/cross-cutting.md §7.2). Plain http: is refused, but for
#   images of the one archive portal the catalogue lists as answering over
#   http only (docs/archives.md §3.1); the `remote_pictures` guard keeps
#   that list and the catalogue's the same.
# - fonts are bundled, as data: URLs.
# - connect-src is this origin plus $csp_connect_src, which
#   csp-connect-src.conf sets: the origins of the API and of the OTLP endpoint
#   when they are elsewhere. The image writes it from its build arguments; a
#   deployment that moves either replaces that file.
# - no plugin, no <base>, no form submission, and no framing by another page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://anom.archivesnationales.culture.gouv.fr $csp_connect_src; media-src 'self' data: blob: https: $csp_connect_src; font-src 'self' data:; connect-src 'self' $csp_connect_src; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
