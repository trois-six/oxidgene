# The development stack's same-origin proxy (docs/authentication.md §8.5).
#
# docker-compose.yml mounts this file into the web container's
# /etc/nginx/locations.d/, whose *.conf nginx-web.conf includes in its
# server: the browser opens the application on http://localhost:8081 and
# reaches the API, the sign-in routes and the assistant endpoint on that same
# origin, as the Helm chart's Ingress serves them, so the session cookie
# stays first-party and no CORS is involved. The published image ships the
# directory empty: in a cluster the Ingress routes these paths.
#
# The backend sends its own security and caching headers; these locations
# add none. Host is the browser's, so the backend's host check sees
# `localhost`; the forwarded headers carry the original scheme and client
# address. Uploads stream to the backend unbuffered and unbounded here — the
# backend enforces its own limits — and a long poll may wait five minutes.

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Connection "";
proxy_request_buffering off;
proxy_read_timeout 300s;
client_max_body_size 0;

location /api/ {
    proxy_pass http://server:8080;
}

location /graphql {
    proxy_pass http://server:8080;
}

location /auth/ {
    proxy_pass http://server:8080;
}

location /mcp {
    proxy_pass http://server:8080;
}

location /.well-known/oauth-protected-resource {
    proxy_pass http://server:8080;
}
