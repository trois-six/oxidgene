worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    # The bundle ships precompressed at gzip -9 (see Dockerfile.web):
    # gzip_static serves those files as they are. What has no .gz beside it
    # (runtime-config.js, written at deploy time) is compressed on the fly.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Sets $csp_connect_src for security-headers.conf.
        include /etc/nginx/csp-connect-src.conf;

        # Every location includes the security headers itself: a location
        # that adds a header of its own inherits none from its server.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /runtime-config.js {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store";
        }

        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
