# Debian's packaged Brotli module: serves the precompressed .br files.
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    # The bundle ships precompressed, as Brotli at quality 11 and as gzip at
    # level 9 (see Dockerfile.web): a client that accepts Brotli gets the .br,
    # any other gzip client the .gz, both served as they are. What has neither
    # beside it (runtime-config.js, written at deploy time) is gzipped on the
    # fly.
    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/javascript;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Sets $csp_connect_src for security-headers.conf.
        include /etc/nginx/csp-connect-src.conf;

        # Further locations of a deployment, empty in the image: the
        # development Compose stack mounts its same-origin proxy of the API
        # and sign-in routes here (nginx-dev-proxy.conf).
        include /etc/nginx/locations.d/*.conf;

        # Every location includes the security headers itself: a location
        # that adds a header of its own inherits none from its server.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /runtime-config.js {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store";
        }

        # Every file of the bundle but the page names its version
        # (docs/architecture.md §4.3): `dx` puts a content hash in the name of
        # the WebAssembly and its script, and pdf.js lives under a directory
        # named after its release. Each is kept a year and never asked for
        # again; a release is new names. A missing file is a 404, never the
        # application's page, which would then be kept as the file.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # pdf.js, loaded when a PDF is opened or previewed, from
        # /pdfjs/{release}/. Its modules and worker run only under a
        # JavaScript type, which nginx's table may not give `.mjs`, so the
        # types are set here.
        location /pdfjs/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            types {
                text/javascript mjs;
                text/css css;
                application/wasm wasm;
                image/gif gif;
            }
            default_type text/plain;
            try_files $uri =404;
        }

        # The page, at every client route: it names the versioned files, so
        # it is revalidated on every load and a release is seen at once.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
