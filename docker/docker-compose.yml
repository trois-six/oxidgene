# OxidGene local development stack
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d --build --wait --remove-orphans
#   docker compose -f docker/docker-compose.yml logs -f server
#   docker compose -f docker/docker-compose.yml down -v
#
# Open the application at http://localhost:8081 — `localhost`, the origin the
# development identity provider and the server's OXIDGENE_PUBLIC_URL name,
# where the browser keeps its `Secure` session cookie over plain HTTP. Sign in
# with a user of docker/rauthy/bootstrap/users.json, such as
# `owner@example.invalid` / `owner` (docs/authentication.md §8.5).

services:
  # ── OpenTelemetry collector ─────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxidgene
      POSTGRES_PASSWORD: oxidgene
      POSTGRES_DB: oxidgene
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxidgene -d oxidgene"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── S3-compatible object storage ────────────────────────────────────
  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "oxidgene-admin"
      RUSTFS_SECRET_KEY: "oxidgene-development-secret"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Creates the media bucket with one signed S3 request: `minio/mc`, which
  # did this, can no longer be pulled from Docker Hub. A bucket that exists
  # already (409) is fine.
  rustfs-init:
    image: curlimages/curl:8.23.0
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: "oxidgene-admin"
      RUSTFS_SECRET_KEY: "oxidgene-development-secret"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        status=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 "aws:amz:us-east-1:s3" \
          --user "$${RUSTFS_ACCESS_KEY}:$${RUSTFS_SECRET_KEY}" \
          http://rustfs:9000/oxidgene-media)
        case "$$status" in
          200|409) echo "media bucket ready" ;;
          *) echo "creating the media bucket failed: HTTP $$status" >&2; exit 1 ;;
        esac

  # ── Identity provider ───────────────────────────────────────────────
  # Rauthy on its embedded Hiqlite database, which lives in the container:
  # a recreated container starts empty and bootstraps rauthy/bootstrap/
  # afresh — the OxidGene clients, groups, API scopes and fictitious users.
  # The browser reaches it on http://localhost:8180, the issuer's host
  # (http://localhost:8180/auth/v1/); the server, on the Compose network, as
  # http://rauthy:8080 (docs/authentication.md §3.4). Rauthy's own
  # administrator is idp-admin@example.invalid / idp-admin-development, at
  # http://localhost:8180/auth/v1/admin. The image has no shell or HTTP
  # client for a health check: rauthy-init below waits for it instead.
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.2
    restart: unless-stopped
    volumes:
      - ./rauthy/config.toml:/app/config.toml:ro
      - ./rauthy/bootstrap:/app/bootstrap:ro
      # Kept as long as pgdata: a recreated container keeps its users'
      # subjects, which the application's accounts are keyed by. Without
      # it every user would sign in under a new subject beside an account
      # the database still holds for the old one.
      - rauthy_data:/app/data
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      # Rauthy stops when its SMTP relay does not answer.
      mailpit:
        condition: service_healthy

  # Rauthy's bootstrap files cannot set a client's extra audiences nor its
  # logos: once it answers, this applies the web client's whole definition
  # through the admin API, OxidGene's resource identifier in its tokens'
  # `aud` included, then the OxidGene logo. Uploaded to Rauthy's own
  # `rauthy` client, the logo is the one of its account and admin pages and
  # of the sign-in page of every client without a logo of its own; the
  # favicon of a sign-in page has no such default and is set per client.
  rauthy-init:
    image: curlimages/curl:8.23.0
    restart: "no"
    depends_on:
      rauthy:
        condition: service_started
    volumes:
      - ./rauthy/oxidgene-web.json:/oxidgene-web.json:ro
      - ../assets/brand/OxidGene.png:/OxidGene.png:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        auth='Authorization: API-Key oxidgene-dev$$oxidgeneDevelopmentApiKeyForTheComposeStackOnlyNeverUseItElsewhere'
        clients=http://rauthy:8080/auth/v1/clients
        curl --fail-with-body --silent --show-error --output /dev/null \
          --retry 60 --retry-all-errors --retry-delay 2 \
          --request PUT --header "$$auth" \
          --header 'Content-Type: application/json' \
          --data @/oxidgene-web.json "$$clients/oxidgene-web"
        for image in rauthy/logo oxidgene-web/favicon oxidgene-mcp/favicon; do
          curl --fail-with-body --silent --show-error --output /dev/null \
            --request PUT --header "$$auth" \
            --form 'image=@/OxidGene.png;type=image/png' "$$clients/$$image"
        done

  # ── Mail relay ──────────────────────────────────────────────────────
  # Keeps every mail for inspection at http://127.0.0.1:8025 and delivers
  # none: Rauthy's own (address verification, password reset, new-login
  # notices), and OxidGene's — invitations and notifications, which the
  # worker sends (docs/messaging.md §3.5).
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Session store ───────────────────────────────────────────────────
  # The server's sessions, sign-in transactions and rate-limit counters
  # (docs/authentication.md §4.5). It holds no genealogy.
  redis:
    image: redis:8-trixie
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── OxidGene server ──────────────────────────────────────────────────
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    environment:
      OXIDGENE_HOST: "0.0.0.0"
      OXIDGENE_PORT: "8080"
      OXIDGENE_DATABASE_URL: "postgres://oxidgene:oxidgene@postgres/oxidgene"
      OXIDGENE_LOG_LEVEL: "${OXIDGENE_SERVER_LOG_LEVEL:-info}"
      # The page's origin, which the web container serves the API on.
      OXIDGENE_CORS_ORIGIN: "http://localhost:8081"
      # Rauthy's back-channel logout calls the server by its Compose name.
      OXIDGENE_ALLOWED_HOSTS: "server"
      # Sign-in against the Rauthy above: the shared settings of
      # rauthy/oxidgene-dev-auth.env, the back channel on the Compose
      # network, and the sessions in Redis.
      OXIDGENE_OIDC_BACKCHANNEL_URL: "http://rauthy:8080"
      OXIDGENE_SESSION_STORE: "redis"
      OXIDGENE_REDIS_URL: "redis://redis:6379/0"
      # A development stack: GraphiQL (which loads from a CDN) is on.
      OXIDGENE_GRAPHIQL: "true"
      OXIDGENE_MEDIA_BACKEND: "s3"
      OXIDGENE_S3_ENDPOINT: "http://rustfs:9000"
      OXIDGENE_S3_BUCKET: "oxidgene-media"
      OXIDGENE_S3_REGION: "us-east-1"
      OXIDGENE_S3_ACCESS_KEY_ID: "oxidgene-admin"
      OXIDGENE_S3_SECRET_ACCESS_KEY: "oxidgene-development-secret"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OXIDGENE_SERVER_OTLP_ENDPOINT-http://otel-collector:4317}"
      # OxidGene's mail goes to the Mailpit below, over plain SMTP on the
      # Compose network (docs/messaging.md §3.5): the server queues it, the
      # worker sends it.
      OXIDGENE_SMTP_HOST: "mailpit"
      OXIDGENE_SMTP_TLS: "danger-insecure"
    env_file:
      - ./rauthy/oxidgene-dev-auth.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rauthy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ── OxidGene import/export worker ───────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      OXIDGENE_DATABASE_URL: "postgres://oxidgene:oxidgene@postgres/oxidgene"
      OXIDGENE_LOG_LEVEL: "${OXIDGENE_WORKER_LOG_LEVEL:-info}"
      OXIDGENE_MEDIA_BACKEND: "s3"
      OXIDGENE_S3_ENDPOINT: "http://rustfs:9000"
      OXIDGENE_S3_BUCKET: "oxidgene-media"
      OXIDGENE_S3_REGION: "us-east-1"
      OXIDGENE_S3_ACCESS_KEY_ID: "oxidgene-admin"
      OXIDGENE_S3_SECRET_ACCESS_KEY: "oxidgene-development-secret"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OXIDGENE_WORKER_OTLP_ENDPOINT-http://otel-collector:4317}"
      # It sends OxidGene's mail to the Mailpit below; its links start with
      # the public URL and its unsubscribe tokens are signed with the session
      # keys of the shared settings file.
      OXIDGENE_SMTP_HOST: "mailpit"
      OXIDGENE_SMTP_TLS: "danger-insecure"
    env_file:
      - ./rauthy/oxidgene-dev-auth.env
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  # ── OxidGene browser frontend ────────────────────────────────────────
  # The bundle calls the API on its own origin (an empty OXIDGENE_API_URL),
  # which nginx-dev-proxy.conf forwards to the server with /auth, /mcp and
  # /.well-known/oauth-protected-resource, as the Helm chart's Ingress does.
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        OXIDGENE_API_URL: ""
        OXIDGENE_LOG_LEVEL: "${OXIDGENE_WEB_LOG_LEVEL:-info}"
        OTEL_EXPORTER_OTLP_ENDPOINT: "${OXIDGENE_WEB_OTLP_ENDPOINT-http://127.0.0.1:4318}"
    restart: unless-stopped
    volumes:
      - ./nginx-dev-proxy.conf:/etc/nginx/locations.d/dev-proxy.conf:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  rauthy_data:
  rustfs_data:
  redis_data:
