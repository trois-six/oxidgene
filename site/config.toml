# The documentation site, published on GitHub Pages by
# .github/workflows/pages.yml. `just site-serve` previews it;
# docs/development.md §7 describes how it is built.
base_url = "https://trois-six.github.io/oxidgene"
title = "OxidGene"
description = "A genealogy application for the desktop and the web, written in Rust."
default_language = "en"
build_search_index = true
generate_feeds = false
# The specifications are copied as they are: their text is never a template.
skip_content_templating = ["tech/**"]

[markdown]
insert_anchor_links = "right"
external_links_target_blank = false
lazy_async_image = true
bottom_footnotes = true
github_alerts = true

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"
style = "inline"

[link_checker]
internal_level = "error"

[search]
include_title = true
include_description = true
include_content = true
truncate_content_length = 2000
index_format = "elasticlunr_javascript"

[extra]
repository = "https://github.com/trois-six/oxidgene"
releases = "https://github.com/trois-six/oxidgene/releases"

