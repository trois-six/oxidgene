[workspace]
resolver = "2"
members = [
    "crates/oxidgene-core",
    "crates/oxidgene-db",
    "crates/oxidgene-api",
    "crates/oxidgene-gedcom",
    "crates/oxidgene-geneanet",
    "crates/oxidgene-ui",
    "apps/oxidgene-server",
    "apps/oxidgene-desktop",
    "apps/oxidgene-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Pierre Erraud"]
repository = "https://github.com/trois-six/oxidgene"

[workspace.dependencies]
# Internal crates
oxidgene-core = { path = "crates/oxidgene-core" }
oxidgene-db = { path = "crates/oxidgene-db" }
oxidgene-api = { path = "crates/oxidgene-api" }
oxidgene-gedcom = { path = "crates/oxidgene-gedcom" }
oxidgene-geneanet = { path = "crates/oxidgene-geneanet" }
oxidgene-ui = { path = "crates/oxidgene-ui" }

# Async runtime — minimal base; each crate adds only what it needs
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# Web framework
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }

# Compression (build-time asset packing + HTTP responses)
flate2 = "1"

# GraphQL (optional — only server binary enables this)
async-graphql = { version = "7.2", features = ["chrono"] }
async-graphql-axum = "7.2"

# ORM & database — base features only; postgres added per-crate via feature flag.
#
# Defaults are off on both, and that is where the weight was. `sea-orm`'s
# defaults add `with-rust_decimal`, `with-bigdecimal` and `with-time` — three
# numeric/date libraries we map no column onto. `sea-orm-migration`'s default is
# `cli`, which links the whole `sea-orm-cli` code generator (and `clap`, and
# `dotenvy`) into a library that only ever runs migrations.
#
# The TLS-less runtime is the base: SQLite is a file, and a driver that speaks
# no TLS is exactly right for it. The server re-adds rustls through the
# `postgres` feature, where a connection really does cross a network.
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-json",
    "with-uuid",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v7", "serde", "js"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"
tempfile = "3"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GEDCOM
ged_io = { version = "0.16.3", features = ["json", "gedzip", "calendar"] }

# GeneWeb .gw reader (converts to the same ged_io model as above)
geneweb = "0.1.2"

# Unicode folding (Geneanet media keys are unaccented — see oxidgene-cli::geneanet::key)
unicode-normalization = "0.1"

# ZIP reader (Geneanet serves multi-page deposits as an archive)
zip = { version = "8", default-features = false, features = ["deflate"] }

# Base64 (GraphQL transport for binary .gw and media payloads)
base64 = "0.23"

# Media storage (Sprint F.1)
# Content addressing: the SHA-256 of a file is both its store key and its ETag.
sha2 = "0.11"
# Thumbnails + intrinsic dimensions. `rayon` is off: thumbnailing already runs
# on a blocking task, one file at a time, so a second thread pool buys nothing.
#
# This trimming only reaches the server binary. `dioxus-desktop` depends on
# `image` with its defaults left on, and Cargo unifies features by union with
# no way to subtract — so the desktop build gets `rayon` back, plus the `avif`
# decoder and with it `rav1e`, an entire AV1 encoder nothing here calls. Undoing
# that needs a patched `dioxus-desktop`, not a line in this file.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
# HTML sanitizer for note bodies (see oxidgene-db::html)
ammonia = "4"

# Configuration. The server reads one optional `oxidgene.toml` and the
# environment; the default feature set also links parsers for JSON, YAML, INI,
# RON and JSON5, for file formats we document nowhere and accept nowhere.
config = { version = "0.15", default-features = false, features = ["toml"] }

# Dioxus (frontend)
dioxus = "0.7.10"

# HTTP client. TLS stays: the download button on a remote medium fetches an
# arbitrary https URL. `charset` and `http2` go: we read JSON and bytes, never a
# legacy-encoded `text/*` body, and one connection to a local Axum server has
# nothing to multiplex. `system-proxy` stays — a desktop user behind a corporate
# proxy should not have to configure one twice.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "multipart",
    "query",
    "rustls",
    "system-proxy",
] }

# Platform directories
dirs = "6"

# Native file dialogs
rfd = "0.17"

[profile.dev]
debug = "line-tables-only"  # smaller debug info → faster incremental builds

# Dependencies are optimised even in a dev build. Our own crates stay
# unoptimised so they remain debuggable and quick to rebuild, but the image
# decoding behind media ingest and the Geneanet content matching is real CPU
# work — unoptimised it turns a half-minute import into a quarter of an hour,
# and `just desktop` is a dev build.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"      # optimise for size
lto = true           # cross-crate dead-code elimination
codegen-units = 1    # required for full LTO
strip = true         # remove debug symbols
panic = "abort"      # no unwinding machinery

