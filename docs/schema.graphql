A person named in a list or a record.
"""
type PersonRef {
	personId: String!
	name: String!
}

type PlaceUsage {
	placeId: String!
	name: String!
	count: Int!
	latitude: Float
	longitude: Float
}

type PyramidBand {
	"""
	First age of the band, which spans five years.
	"""
	from: Int!
	men: Int!
	women: Int!
}

