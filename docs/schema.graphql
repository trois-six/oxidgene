	calendar: GqlCalendar
	cause: String
	age: String
	agency: String
	"""
	Replaces a family event's spouse ages when given; an empty list
	clears them.
	"""
	spouseAges: [SpouseAgeInput!]
	placeId: String
	description: String
}

"""
Input for updating a family.
"""
input UpdateFamilyInput {
	privacy: GqlPrivacy
}

"""
Input for updating media metadata.

A media carries the same descriptive fields a fact does. There is no source
field on purpose: a media *is* a source document. `dateSort` is absent
because the server derives it, exactly as it does for an event.
"""
input UpdateMediaInput {
	title: String
	description: String
	dateValue: String
	dateValue2: String
	dateQualifier: GqlDateQualifier
	calendar: GqlCalendar
	placeId: String
	"""
	The URL of a remote media. Refused for a media whose bytes we hold.
	"""
	filePath: String
	mimeType: String
	"""
	The picture's pixel size, sent together or not at all. Accepted only
	for a page we do not hold: we never fetch a remote file, so the client
	that displayed it is the only witness to how big it is.
	"""
	width: Int
	height: Int
	"""
	Whether this is shown when the tree is published.
	"""
	privacy: GqlPrivacy
	"""
	What the medium physically is, in GEDCOM's own vocabulary.
	"""
	sourceMediaType: GqlSourceMediaType
	"""
	What kind of record it is. Setting it without a `sourceMediaType` also
	sets the medium it implies, so a census return does not export as
	`OTHER`.
	"""
	documentCategory: GqlDocumentCategory
}

"""
Input for updating a note.
"""
input UpdateNoteInput {
	text: String
}

"""
Input for updating a person.
"""
input UpdatePersonInput {
	sex: GqlSex
	privacy: GqlPrivacy
}

"""
Input for updating a person name (all fields optional except id).
"""
input UpdatePersonNameInput {
	nameType: GqlNameType
	givenNames: String
	surname: String
	surnamePrefix: String
	prefix: String
	suffix: String
	nickname: String
	isPrimary: Boolean
	sortOrder: Int
}

"""
Input for updating a place.
"""
input UpdatePlaceInput {
	name: String
	latitude: Float
	longitude: Float
}

"""
Input for updating a repository.
"""
input UpdateRepositoryInput {
	name: String
	address: String
	phone: String
	email: String
	website: String
}

"""
Input for updating a source.
"""
input UpdateSourceInput {
	title: String
	author: String
	publisher: String
	abbreviation: String
	agency: String
}

"""
Input for updating a source's link to a repository.
"""
input UpdateSourceRepositoryInput {
	"""
	Points the link at another repository.
	"""
	repositoryId: ID
	callNumber: String
	mediaType: GqlSourceMediaType
	sortOrder: Int
}

"""
Input for updating an existing tree.
"""
input UpdateTreeInput {
	"""
	What `Default` privacy resolves to for everything in this tree.
	"""
	defaultPrivacy: GqlTreeDefaultPrivacy
	"""
	Whether entry fields suggest values as the user types.
	"""
	entrySuggestions: Boolean
	"""
	How much of a date the tree's pages write.
	"""
	dateFormat: GqlDateDisplayFormat
	"""
	Whether lifespans write the birth and death symbols.
	"""
	dateSymbols: Boolean
	"""
	Whether an approximate date reads « c. ».
	"""
	dateCirca: Boolean
	"""
	The calendar a date recorded in another one is also given in.
	"""
	dateCalendar: GqlCalendar
	"""
	Whether surname fields write in capitals.
	"""
	surnameUppercase: Boolean
	"""
	Whether adding a relative offers the persons already in the tree.
	"""
	suggestPersons: Boolean
	"""
	The order and form of a date field's parts.
	"""
	dateInputFormat: GqlDateInputFormat
	"""
	The calendar an empty date field starts in.
	"""
	dateInputCalendar: GqlCalendar
	name: String
	description: String
	sosaRootPersonId: String
	selfPersonId: String
	"""
	Who the tree's GEDCOM exports say they are from.
	"""
	submitterName: String
	submitterEmail: String
	submitterAddress: String
}

"""
Input for moving or re-attributing a vignette.

The four rectangle fields travel together: send all of them or none.
"""
input UpdateVignetteInput {
	x: Int
	y: Int
	width: Int
	height: Int
	personId: String
	eventId: String
}

"""
Input for uploading a file's actual bytes.

The content travels base64-encoded in the request body, the same choice the
GEDCOM and GeneWeb import mutations make: adding the `Upload` scalar would
mean multipart GraphQL requests, a transport every client would then have
to special-case for one field. REST's `POST .../media/upload` is the
efficient path and is what the UI uses; this exists so no operation is
reachable from only one of the two APIs.

Base64 inflates the payload by a third, so the effective size ceiling here
is correspondingly lower than REST's.
"""
input UploadMediaFileInput {
	"""
	The document the file becomes a page of. Ignored when `mediaId` names
	an existing page to fill in.
	"""
	documentId: String
	fileName: String!
	"""
	Base64-encoded file content.
	"""
	contentBase64: String!
	title: String
	description: String
	"""
	Attach the bytes to an existing page instead of creating one.
	"""
	mediaId: String
}

"""
Input for recording a media file we do not hold the bytes of.

The metadata-only path, mirroring `POST /trees/{id}/media`. To send actual
bytes, use `uploadMediaFile`.
"""
input UploadMediaInput {
	"""
	The document this becomes a page of. Bytes and URLs live on pages, and
	a page always belongs to a document; create one with
	`createMediaDocument` first.
	"""
	documentId: String!
	fileName: String!
	mimeType: String!
	filePath: String!
	fileSize: Int!
	title: String
	description: String
}

"""
One year's counts per category (a month, a weekday, a kind of event).
"""
type YearCounts {
	year: Int!
	counts: [Int!]!
}

"""
The values one year adds to an average: their sum and how many they
are, so a period's average is its years' sums over their counts.
"""
type YearSum {
	year: Int!
	sum: Float!
	count: Int!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: QueryRoot
	mutation: MutationRoot
}
