	"""
	Own events of either person left out of the merged record.
	"""
	leftOutEvents: [ID!]! = []
	"""
	The duplicate's direct media links not taken.
	"""
	leftOutMediaLinks: [ID!]! = []
	surnameFromDuplicate: Boolean! = false
	givenNamesFromDuplicate: Boolean! = false
	sexFromDuplicate: Boolean! = false
}

type MutationRoot {
	"""
	Create a new tree. A blank name is refused.
	"""
	createTree(input: CreateTreeInput!): GqlTree!
	"""
	Duplicate a tree through a lossless GEDCOM round trip.
	
	The duplication path deliberately never enables export compatibility
	options: those are for third-party interchange, not a copy inside
	OxidGene. Mirrors `POST /trees/:tree_id/duplicate`.
	"""
	duplicateTree(treeId: ID!, name: String!): GqlTree!
	"""
	Update an existing tree. A blank name is refused, and a SOSA root or
	own record from another tree is not found.
	"""
	updateTree(id: ID!, input: UpdateTreeInput!): GqlTree!
	"""
	Delete a tree.
	
	Flags it as deleted and returns straight away; the rows it owns and its
	projections are removed by the background purge worker. See
	[`crate::service::purge`].
	"""
	deleteTree(id: ID!): Boolean!
	"""
	Create a new person in a tree.
	"""
	createPerson(treeId: ID!, input: CreatePersonInput!): GqlPerson!
	"""
	Update a person.
	"""
	updatePerson(treeId: ID!, id: ID!, input: UpdatePersonInput!): GqlPerson!
	"""
	Delete a person (soft delete).
	"""
	deletePerson(treeId: ID!, id: ID!): Boolean!
	"""
	Record that a person differs from each of `otherPersonIds`, so those
	pairs stop being offered as homonyms.
	"""
	markPersonsDistinct(treeId: ID!, personId: ID!, otherPersonIds: [ID!]!): Boolean!
	"""
	Merge `duplicateId` into `personId`, which is kept; the duplicate is
	soft-deleted. `choices` carries what the comparison chose. Returns the
	kept person.
	"""
	mergePersons(treeId: ID!, personId: ID!, duplicateId: ID!, choices: MergeChoicesInput! = {leftOutEvents: [], leftOutMediaLinks: [], surnameFromDuplicate: false, givenNamesFromDuplicate: false, sexFromDuplicate: false}): GqlPerson!
	"""
	Add a name to a person.
	"""
	addPersonName(treeId: ID!, personId: ID!, input: PersonNameInput!): GqlPersonName!
	"""
	Update a name of a person; a name of somebody else is not found.
	"""
	updatePersonName(treeId: ID!, personId: ID!, id: ID!, input: UpdatePersonNameInput!): GqlPersonName!
	"""
	Delete a name of a person (hard delete); a name of somebody else is
	not found.
	"""
	deletePersonName(treeId: ID!, personId: ID!, id: ID!): Boolean!
	"""
	Create a new family in a tree.
	"""
	createFamily(treeId: ID!): GqlFamily!
	"""
	Update a family: its privacy, and `updatedAt` either way.
	"""
	updateFamily(treeId: ID!, id: ID!, input: UpdateFamilyInput!): GqlFamily!
	"""
	Delete a family (soft delete).
	"""
	deleteFamily(treeId: ID!, id: ID!): Boolean!
	"""
	Add a spouse to a family.
	"""
	addSpouse(treeId: ID!, familyId: ID!, input: AddSpouseInput!): GqlFamilySpouse!
	"""
	Remove a spouse link from a family (hard delete); a link of another
	family is not found.
	"""
	removeSpouse(treeId: ID!, familyId: ID!, id: ID!): Boolean!
	"""
	Add a child to a family.
	"""
	addChild(treeId: ID!, familyId: ID!, input: AddChildInput!): GqlFamilyChild!
	"""
	Remove a child link from a family (hard delete); a link of another
	family is not found.
	"""
	removeChild(treeId: ID!, familyId: ID!, id: ID!): Boolean!
	"""
	Create a new event.
	"""
	createEvent(treeId: ID!, input: CreateEventInput!): GqlEvent!
	"""
	Update an event. A place of another tree is not found.
	"""
	updateEvent(treeId: ID!, id: ID!, input: UpdateEventInput!): GqlEvent!
	"""
	Delete an event (soft delete).
	"""
	deleteEvent(treeId: ID!, id: ID!): Boolean!
	"""
	Add a witness to an event.
	"""
	addEventWitness(treeId: ID!, eventId: ID!, input: AddEventWitnessInput!): GqlEventWitness!
	"""
	Remove a witness from an event (hard delete). With `eventId`, a
	witness of another event is not found.
	"""
	removeEventWitness(treeId: ID!, id: ID!, eventId: ID): Boolean!
	"""
	Create a new place. A blank name is refused.
	"""
	createPlace(treeId: ID!, input: CreatePlaceInput!): GqlPlace!
	"""
	Update a place. A blank name is refused.
	"""
	updatePlace(treeId: ID!, id: ID!, input: UpdatePlaceInput!): GqlPlace!
	"""
	Delete a place (hard delete).
	"""
	deletePlace(treeId: ID!, id: ID!): Boolean!
	"""
	Create a new source. A blank title is refused.
	"""
	createSource(treeId: ID!, input: CreateSourceInput!): GqlSource!
	"""
	Update a source. A blank title is refused.
	"""
	updateSource(treeId: ID!, id: ID!, input: UpdateSourceInput!): GqlSource!
	"""
	Delete a source (soft delete).
	With `onlyIfUnused`, the source is kept if any citation, note, media link or repository
	link still points at it; the return value says whether it was deleted.
	"""
	deleteSource(treeId: ID!, id: ID!, onlyIfUnused: Boolean! = false): Boolean!
	"""
	Create a repository. A blank name is refused.
	"""
	createRepository(treeId: ID!, input: CreateRepositoryInput!): GqlRepository!
	"""
	Update a repository. A blank name is refused.
	"""
	updateRepository(treeId: ID!, id: ID!, input: UpdateRepositoryInput!): GqlRepository!
	"""
	Delete a repository (soft delete). With `onlyIfUnused`, a repository
	still holding a live source or the subject of a note is kept; the
	return value says whether it was deleted.
	"""
	deleteRepository(treeId: ID!, id: ID!, onlyIfUnused: Boolean! = false): Boolean!
	"""
	Record that a source is held at a repository, under a call number.
	"""
	addSourceRepository(treeId: ID!, sourceId: ID!, input: AddSourceRepositoryInput!): GqlSourceRepository!
	"""
	Update a source's link to a repository; a link of another source is
	not found.
	"""
	updateSourceRepository(treeId: ID!, sourceId: ID!, id: ID!, input: UpdateSourceRepositoryInput!): GqlSourceRepository!
	"""
	Remove a source's link to a repository; a link of another source is
	not found.
	"""
	removeSourceRepository(treeId: ID!, sourceId: ID!, id: ID!): Boolean!
	"""
	Create a new citation.
	"""
	createCitation(treeId: ID!, input: CreateCitationInput!): GqlCitation!
	"""
	Update a citation.
	"""
	updateCitation(treeId: ID!, id: ID!, input: UpdateCitationInput!): GqlCitation!
	"""
	Delete a citation (hard delete).
	"""
	deleteCitation(treeId: ID!, id: ID!): Boolean!
	"""
	Add a page naming a file we do not hold — a URL, or a path a GEDCOM
	mentioned — to a document. Mirrors `POST /trees/{treeId}/media`.
	"""
	uploadMedia(treeId: ID!, input: UploadMediaInput!): GqlMedia!
	"""
	Upload a file's bytes, base64-encoded.
	
	Creates a page of `documentId`, or fills in an existing page when
	`mediaId` is given. Mirrors `POST /trees/{treeId}/media/upload`; see
	[`UploadMediaFileInput`] for why the content is base64 rather than an
	`Upload` scalar.
	"""
	uploadMediaFile(treeId: ID!, input: UploadMediaFileInput!): GqlMedia!
	"""
	Update media metadata.
	"""
	updateMedia(treeId: ID!, id: ID!, input: UpdateMediaInput!): GqlMedia!
	"""
	Atomically add a tag without replacing the media's other tags.
	"""
	addMediaTag(treeId: ID!, id: ID!, tag: String!): GqlMedia!
	"""
	Atomically remove one tag without replacing the media's other tags.
	"""
	removeMediaTag(treeId: ID!, id: ID!, tag: String!): Boolean!
	"""
	Permanently delete media and its associated data.
	
	With `onlyIfUnreferencedElsewhere`, the supplied gallery link is
	ignored while checking references; `false` means another reference
	retained the media. This is the GraphQL mirror of REST's
	`only_if_unreferenced_elsewhere` query parameter.
	"""
	deleteMedia(treeId: ID!, id: ID!, onlyIfUnreferencedElsewhere: Boolean! = false, allowedLinkId: ID): Boolean!
	"""
	Choose what represents a person: a whole media, a region of one, or
	nothing.
	
	One write on the person. Passing neither id clears the portrait;
	passing both is refused, since that is not a state the model holds.
	"""
	setPersonPortrait(treeId: ID!, personId: ID!, mediaId: ID, vignetteId: ID): GqlPerson!
	"""
	Create an empty multi-page document.
	"""
	createMediaDocument(treeId: ID!, title: String): GqlMedia!
	"""
	Set a document's page order. The list must name exactly its pages.
	"""
	reorderMediaPages(treeId: ID!, documentId: ID!, pageIds: [ID!]!): [GqlMedia!]!
	"""
	Remove a page from its document, permanently.
	
	The bytes, transcript, links and identifications go with it. Removing
	the last page leaves the document standing and empty.
	"""
	deleteMediaPage(treeId: ID!, documentId: ID!, pageId: ID!): Boolean!
	"""
	Crop a region out of a media file.
	"""
	createVignette(treeId: ID!, input: CreateVignetteInput!): GqlVignette!
	"""
	Move or re-attribute a vignette.
	"""
	updateVignette(treeId: ID!, id: ID!, input: UpdateVignetteInput!): GqlVignette!
	"""
	Delete a vignette. The media it cropped is untouched.
	"""
	deleteVignette(treeId: ID!, id: ID!): Boolean!
	"""
	Create a media link.
	"""
	createMediaLink(treeId: ID!, input: CreateMediaLinkInput!): GqlMediaLink!
	"""
	Delete a media link (hard delete).
	"""
	deleteMediaLink(treeId: ID!, id: ID!): Boolean!
	"""
	Create a new note.
	"""
	createNote(treeId: ID!, input: CreateNoteInput!): GqlNote!
	"""
	Update a note.
	"""
	updateNote(treeId: ID!, id: ID!, input: UpdateNoteInput!): GqlNote!
	"""
	Delete a note (soft delete).
	"""
	deleteNote(treeId: ID!, id: ID!): Boolean!
	"""
	Re-cut every occurrence of one surname at the given particle — the
	dictionary's bulk repair for an import that guessed wrong across a
	whole family. Triggers a full projection rebuild when anything changed.
	"""
	setFamilyNameParticle(treeId: ID!, input: SetFamilyNameParticleInput!): GqlFamilyNameParticleUpdate!
	"""
	Give every person whose primary name carries one surname another one,
	merging into that name when it is already listed. Mirrors
	`PATCH /trees/{id}/dictionary/family-names/rename`.
	"""
	renameFamilyName(treeId: ID!, input: RenameFamilyNameInput!): GqlFamilyNameRename!
	"""
	Queue a durable GEDZIP export. The artifact is downloaded through the
	URL exposed by `exportJobStatus` once the worker completes it. A tree
	already running a job answers CONFLICT. The options are
	`exportGedcom`'s, plus `includeMedia: false` to pack no media and
	write no `OBJE`.
	"""
	startExportJob(treeId: ID!, mergeOccupations: Boolean, mergeNames: Boolean, includeNotesAndSources: Boolean, includeMedia: Boolean): GqlBackgroundJobStarted!
	"""
	Encode a Geneanet wizard session as a base64 archive.
	"""
	encodeGeneanetSession(input: GeneanetSessionEncodeInput!): GqlGeneanetSessionArchive!
	"""
	Delete the staged media of a decoded session the wizard closed or
	reset without importing, as `POST /geneanet/session/release` does. A
	path the backend did not stage is ignored.
	"""
	releaseGeneanetSessionMedia(paths: [String!]!): Boolean!
	"""
	Decode a saved Geneanet session. Its media are staged as local files
	for a following desktop import, just as they are through REST.
	"""
	decodeGeneanetSession(archiveBase64: String!): GqlGeneanetSession!
	"""
	Queue a Geneanet tree import with media collected by the desktop window.
	"""
	importGeneanet(treeId: ID!, input: GeneanetImportInput!): GqlBackgroundJobStarted!
	"""
	Put a record back as one of its versions had it. The restore is a
	write of its own, returned as its audit entry. Mirrors
	`POST /trees/{treeId}/history/{recordType}/{recordId}/revert`.
	"""
	revertRecord(treeId: ID!, recordType: GqlRecordType!, recordId: ID!, version: Int!): GqlAuditEntry!
	"""
	Rebuild every projection of a tree (all persons + search index).
	"""
	rebuildTreeProfiles(treeId: ID!): GqlProfileRebuildResult!
	"""
	Rebuild the projection of a single person.
	"""
	rebuildPersonProfile(treeId: ID!, personId: ID!): GqlProfileRebuildResult!
	"""
	Drop every projection of a tree. For debugging or after bulk operations.
	"""
	dropTreeProfiles(treeId: ID!): Boolean!
}

"""
ISO 8601 calendar date without timezone.
Format: %Y-%m-%d

# Examples

* `1994-11-13`
* `2000-02-24`
"""
scalar NaiveDate

type ParentAgeSeries {
	fatherFirstChild: [YearSum!]!
	motherFirstChild: [YearSum!]!
	fatherLastChild: [YearSum!]!
	motherLastChild: [YearSum!]!
	"""
	At the birth of each child, by year of that birth.
	"""
	fatherEveryChild: [YearSum!]!
	motherEveryChild: [YearSum!]!
}

"""
Input for adding or updating a person name.
"""
input PersonNameInput {
	nameType: GqlNameType!
	givenNames: String
	"""
	The surname root, particle excluded.
	
	Stored verbatim: the server does not detect a particle hiding in it.
	Callers holding a full surname should split it with
	`oxidgene_core::types::split_surname_particle` first, as the UI does.
	"""
	surname: String
	"""
	The surname particle, GEDCOM `SPFX` ("de la", "van der").
	"""
	surnamePrefix: String
	prefix: String
	suffix: String
	nickname: String
	isPrimary: Boolean!
	sortOrder: Int
}

type PersonRecord {
	personId: String!
	name: String!
	"""
	`Sex` in its snake_case form.
	"""
	sex: String!
	"""
	The event the list is about (a birth, a death).
	"""
	date: RecordDate
	place: String
	birth: RecordDate
	death: RecordDate
	"""
	Age in whole years, at death or today.
	"""
	age: Int
}

