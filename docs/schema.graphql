"""
A found ancestor and which key facts are recorded.
"""
type AncestorFacts {
	personId: String!
	name: String!
	"""
	`Sex` in its snake_case form.
	"""
	sex: String!
	"""
	The birth, or the baptism, when it carries a date.
	"""
	birth: RecordDate
	"""
	The death, or the burial, when it carries a date.
	"""
	death: RecordDate
	hasBirth: Boolean!
	hasDeath: Boolean!
	hasUnion: Boolean!
	living: Boolean!
}

"""
A tree's ancestry completeness.
"""
type AncestryCompleteness {
	"""
	The SOSA root, `None` when the tree has none.
	"""
	root: PersonRef
	"""
	One per generation, the root's first, up to the generations asked
	for; empty without a root.
	"""
	generations: [AncestryGeneration!]!
}

"""
One SOSA number of a generation.
"""
type AncestryEntry {
	sosa: Int!
	"""
	`None` for a missing ancestor.
	"""
	person: AncestorFacts
}

"""
One generation of ancestors.
"""
type AncestryGeneration {
	"""
	1 for the root, 2 for the parents…
	"""
	generation: Int!
	"""
	The ancestors a complete tree has there: 2^(generation − 1).
	"""
	expected: Int!
	"""
	Those known. An ancestor reached through two lines (pedigree
	collapse) counts at each of their SOSA numbers.
	"""
	found: Int!
	"""
	Found ancestors with a birth or a baptism, with a death or a burial,
	and with a union to the other parent of their child (§4).
	"""
	withBirth: Int!
	withDeath: Int!
	withUnion: Int!
	"""
	Found ancestors with no death recorded who may be alive.
	"""
	living: Int!
	"""
	Ancestors missing because their child is missing too: implied, not
	listed in `entries`.
	"""
	impliedMissing: Int!
	"""
	The found ancestors, and the missing parents of the previous
	generation's found ones, by SOSA number.
	"""
	entries: [AncestryEntry!]!
}

"""
One anomaly: the persons concerned, the subject first, and what the
rule measured.
"""
type Anomaly {
	persons: [PersonRef!]!
	"""
	The union concerned, for the rules about one.
	"""
	familyId: String
	"""
	The figure the rule measured: whole years for ages and gaps in
	years, days for gaps between births and deaths.
	"""
	value: Int
	"""
	The event concerned, an `EventType` in its snake_case form.
	"""
	eventType: String
	"""
	Recorded text the rule is about: an unreadable date, a relation.
	"""
	text: String
}

"""
What one rule found.
"""
type AnomalyRule {
	rule: String!
	"""
	`dates`, `filiation`, `unions`, `witnesses` or `data_quality`.
	"""
	category: String!
	"""
	`error` for the impossible, `warning` for the unlikely.
	"""
	severity: String!
	"""
	Everything found, of which `items` lists at most
	[`MAX_ITEMS_PER_RULE`].
	"""
	count: Int!
	items: [Anomaly!]!
}

"""
A populated place, labelled on the map from a zoom on.
"""
type BasemapCity {
	name: String!
	"""
	Its names in the interface languages, where they differ.
	"""
	names: [LocalName!]!
	"""
	Longitude and latitude in tenths of a degree.
	"""
	lon: Int!
	lat: Int!
	"""
	The web map zoom level it is labelled from, in tenths (Natural
	Earth's `MIN_ZOOM`).
	"""
	zoom: Int!
	"""
	In thousands.
	"""
	population: Int!
}

"""
One country's outline and populated places.
"""
type BasemapCountry {
	"""
	ISO 3166-1 alpha-2 code, `-99` where Natural Earth has none.
	"""
	iso: String!
	name: String!
	"""
	Outer rings, each a flat list of `longitude, latitude` pairs in tenths
	of a degree.
	"""
	rings: [[Int!]!]!
	"""
	Populated places, by the zoom they are labelled from, then the most
	populated first.
	"""
	cities: [BasemapCity!]!
}

